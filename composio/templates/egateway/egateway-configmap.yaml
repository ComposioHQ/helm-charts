{{- if .Values.egateway.enabled }}
{{- $authMode := .Values.egateway.composioAuth.mode | default "api_key" }}
{{- if not (has $authMode (list "api_key" "jwt")) }}
{{- fail (printf "egateway.composioAuth.mode must be api_key or jwt, got %q" $authMode) }}
{{- end }}
{{- if include "egateway.composioJwtEnabled" . }}
{{- if not .Values.egateway.composioAuth.jwt.keyId }}
{{- fail "egateway.composioAuth.jwt.keyId is required when egateway.composioAuth.mode is jwt" }}
{{- end }}
{{- if .Values.apollo.auth.jwt.enabled }}
{{- fail "egateway.composioAuth.mode=jwt configures Apollo's JWT verifier itself; leave apollo.auth.jwt.enabled false (Apollo accepts one JWKS URL)" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "composio.fullname" . }}-egateway-config
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: egateway
data:
  NODE_ENV: "production"
  # Composio's SaaS observability and email providers are off in self-hosted installs.
  SENTRY_ENABLED: "false"
  DATADOG_ENABLED: "false"
  RESEND_ENABLED: "false"
  AUTH_PUBLIC_URL: {{ printf "https://%s" (include "egateway.adminHost" .) | quote }}
  NEXTAUTH_URL: {{ printf "https://%s" (include "egateway.adminHost" .) | quote }}
  PROXY_PUBLIC_URL: {{ printf "https://%s" (include "egateway.proxyHost" .) | quote }}
  FUSIONAUTH_URL: {{ printf "https://%s" (include "egateway.authHost" .) | quote }}
  {{- if .Values.egateway.fusionauth.enabled }}
  # Server-to-server calls use the Service, so admin readiness does not depend on
  # public DNS, Ingress or TLS. Browsers keep using FUSIONAUTH_URL.
  FUSIONAUTH_INTERNAL_URL: {{ printf "http://%s:9011" (include "egateway.fusionauthServiceName" .) | quote }}
  {{- end }}
  FUSIONAUTH_ISSUER: {{ include "egateway.authHost" . | quote }}
  FUSIONAUTH_JWKS_URL: {{ printf "http://%s:9011/.well-known/jwks.json" (include "egateway.fusionauthServiceName" .) | quote }}
  FUSIONAUTH_ADMIN_REDIRECT_URL: {{ printf "https://%s/api/auth/callback" (include "egateway.adminHost" .) | quote }}
  COMPOSIO_BASE_URL: {{ include "egateway.composioBaseUrl" . | quote }}
  COMPOSIO_AUTH_MODE: {{ $authMode | quote }}
  {{- if include "egateway.composioJwtEnabled" . }}
  COMPOSIO_JWT_KEY_ID: {{ .Values.egateway.composioAuth.jwt.keyId | quote }}
  COMPOSIO_JWT_ISSUER: {{ include "egateway.composioJwtIssuer" . | quote }}
  COMPOSIO_JWT_TTL_SECONDS: {{ .Values.egateway.composioAuth.jwt.ttlSeconds | default 900 | toString | quote }}
  {{- with .Values.egateway.composioAuth.jwt.previousPublicJwks }}
  COMPOSIO_JWT_PREVIOUS_PUBLIC_JWKS: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
