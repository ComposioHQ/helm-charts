{{- if .Values.egateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egateway.proxyServiceName" . }}
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: egateway-proxy
spec:
  replicas: {{ .Values.egateway.proxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "composio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: egateway-proxy
  template:
    metadata:
      labels:
        {{- include "composio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: egateway-proxy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/egateway/egateway-configmap.yaml") . | sha256sum }}
    spec:
      {{- include "egateway.imagePullSecrets" . | nindent 6 }}
      {{- include "egateway.podSecurityContext" . | nindent 6 }}
      {{- with .Values.egateway.proxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.egateway.proxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.egateway.proxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: proxy
          image: {{ include "composio.imageReference" (dict "image" .Values.egateway.proxy.image "context" .) | quote }}
          imagePullPolicy: {{ .Values.egateway.proxy.image.pullPolicy }}
          {{- include "egateway.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: {{ include "composio.fullname" . }}-egateway-config
          env:
            - name: PORT
              value: "3001"
            # Host-header allow-list; the proxy refuses to start in production without one.
            {{- if .Values.egateway.fusionauth.enabled }}
            # The proxy only calls FusionAuth from the server, so it never needs the public host.
            - name: FUSIONAUTH_URL
              value: {{ printf "http://%s:9011" (include "egateway.fusionauthServiceName" .) | quote }}
            {{- end }}
            - name: ALLOWED_HOSTS
              value: {{ join "," (.Values.egateway.proxy.allowedHosts | default (list (include "egateway.proxyHost" .) (include "egateway.proxyServiceName" .))) | quote }}
            {{- include "egateway.secretEnv" . | nindent 12 }}
            {{- with .Values.egateway.proxy.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.egateway.proxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "egateway.proxyServiceName" . }}
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: egateway-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: http
  selector:
    {{- include "composio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: egateway-proxy
{{- end }}
