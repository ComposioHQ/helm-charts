{{- if and .Values.egateway.enabled .Values.egateway.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "composio.fullname" . }}-egateway-migrate
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: egateway-migrate
  annotations:
    # Runs after the databaseMigration job (weight -5) creates the database.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "composio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: egateway-migrate
    spec:
      restartPolicy: Never
      {{- include "egateway.imagePullSecrets" . | nindent 6 }}
      {{- include "egateway.podSecurityContext" . | nindent 6 }}
      {{- if .Values.databaseTls.enabled }}
      volumes:
        {{- include "composio.databaseTlsVolume" . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "composio.imageReference" (dict "image" .Values.egateway.migrate.image "context" .) | quote }}
          imagePullPolicy: {{ .Values.egateway.migrate.image.pullPolicy }}
          {{- include "egateway.containerSecurityContext" . | nindent 10 }}
          # Same as the image's default command (packages/db/Dockerfile).
          command: ["bun", "run", "--filter", "@repo/db", "db:migrate"]
          {{- if .Values.databaseTls.enabled }}
          volumeMounts:
            {{- include "composio.databaseTlsMount" . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.egateway.migrate.resources | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "egateway.secretName" . }}
                  key: {{ .Values.egateway.migrate.databaseSecretKey }}
{{- end }}
