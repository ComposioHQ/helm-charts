{{- if and .Values.egateway.enabled .Values.egateway.fusionauth.enabled }}
{{- $fa := .Values.egateway.fusionauth }}
{{- $dbHost := $fa.database.host | default .Values.databaseMigration.host }}
{{- $dbPort := $fa.database.port | default .Values.databaseMigration.port }}
{{- $dbUser := $fa.database.user | default .Values.databaseMigration.user }}
{{- $secret := include "egateway.secretName" . }}
{{- $search := $fa.search }}
{{- if not (has $search.engine (list "database" "elasticsearch")) }}
{{- fail (printf "egateway.fusionauth.search.engine must be \"database\" or \"elasticsearch\", got %q" $search.engine) }}
{{- end }}
{{- $useSearchEngine := eq $search.engine "elasticsearch" }}
{{- $reindex := and $useSearchEngine $search.reindexIfEmpty }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "egateway.fusionauthServiceName" . }}-kickstart
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: egateway-fusionauth
data:
  # Runs once on a fresh FusionAuth database. Creates the API key admin/proxy
  # use (from the FUSIONAUTH_API_KEY secret), generates an RS256 signing key and
  # makes it the default tenant's JWT key, and sets the default tenant issuer.
  # Org tenants and applications are provisioned at runtime by admin; new tenants
  # copy the default tenant's JWT keys. A fresh FusionAuth only has HMAC keys, which
  # /.well-known/jwks.json does not publish, so without the RS256 key admin and proxy
  # cannot validate any login token.
  kickstart.json: |
    {
      "variables": {
        "jwtSigningKeyId": {{ $fa.jwtSigningKeyId | quote }}
      },
      {{- if $fa.license.enabled }}
      "licenseId": "#{ENV.FUSIONAUTH_LICENSE_ID}",
      {{- end }}
      "apiKeys": [
        {
          "key": "#{ENV.FUSIONAUTH_API_KEY}",
          "description": "Composio eGateway",
          "keyManager": true
        }
      ],
      "requests": [
        {
          "method": "POST",
          "url": "/api/key/generate/#{jwtSigningKeyId}",
          "body": {
            "key": {
              "algorithm": "RS256",
              "name": "Composio eGateway JWT signing key",
              "length": 2048
            }
          }
        },
        {
          "method": "PATCH",
          "url": "/api/tenant/#{FUSIONAUTH_TENANT_ID}",
          "body": {
            "tenant": {
              "issuer": {{ include "egateway.authIssuer" . | quote }},
              "jwtConfiguration": {
                "accessTokenKeyId": "#{jwtSigningKeyId}",
                "idTokenKeyId": "#{jwtSigningKeyId}"
              }
            }
          }
        }
      ]
    }
  {{- if $reindex }}
  # postStart hook (search engine only). A new or wiped index is empty, and
  # searches against it succeed with zero results, so the People page would
  # show no org admins. When the user index is empty, rebuild the user and
  # entity indexes from Postgres. Always exits 0: a failing postStart hook
  # kills the container.
  reindex-if-empty.sh: |
    FA=http://localhost:9011
    i=0
    until curl -sf -o /dev/null "$FA/api/status"; do
      i=$((i+1)); [ "$i" -ge 120 ] && exit 0; sleep 5
    done
    total=$(curl -sf -H "Authorization: $FUSIONAUTH_API_KEY" \
      "$FA/api/user/search?queryString=*&numberOfResults=1&accurateTotal=true" \
      | grep -o '"total":[0-9]*' | cut -d: -f2)
    [ "$total" = "0" ] || exit 0
    echo "FusionAuth search index is empty; reindexing users and entities" > /proc/1/fd/1
    for index in fusionauth_user fusionauth_entity; do
      i=0
      # One reindex at a time: FusionAuth answers 400 while another runs.
      until [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
          -H "Authorization: $FUSIONAUTH_API_KEY" -H 'Content-Type: application/json' \
          -d "{\"index\":\"$index\"}" "$FA/api/system/reindex")" = "202" ]; do
        i=$((i+1)); [ "$i" -ge 60 ] && break; sleep 5
      done
    done
    exit 0
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egateway.fusionauthServiceName" . }}
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: egateway-fusionauth
spec:
  replicas: {{ $fa.replicaCount }}
  selector:
    matchLabels:
      {{- include "composio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: egateway-fusionauth
  template:
    metadata:
      labels:
        {{- include "composio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: egateway-fusionauth
    spec:
      {{- with .Values.egateway.fusionauth.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.egateway.fusionauth.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.egateway.fusionauth.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "egateway.imagePullSecrets" . | nindent 6 }}
      {{- with $fa.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "egateway.bundledOpensearch" . }}
      initContainers:
        # FusionAuth needs the search engine reachable at startup.
        - name: wait-for-opensearch
          image: {{ .Values.egateway.cronJobs.image | quote }}
          {{- with $fa.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - until curl -sf -o /dev/null {{ include "egateway.searchServers" . }}/_cluster/health; do echo waiting for opensearch; sleep 5; done
      {{- end }}
      containers:
        - name: fusionauth
          {{- if $fa.image.imageName }}
          image: {{ $fa.image.imageName | quote }}
          {{- else if $fa.image.digest }}
          image: {{ printf "%s:%s@%s" $fa.image.repository $fa.image.tag $fa.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" $fa.image.repository $fa.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ $fa.image.pullPolicy }}
          {{- with $fa.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 9011
          env:
            - name: DATABASE_URL
              {{- if $fa.database.urlSecretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $fa.database.urlSecretKey }}
              {{- else }}
              value: {{ printf "jdbc:postgresql://%s:%v/%s" $dbHost $dbPort $fa.database.name | quote }}
              {{- end }}
            - name: DATABASE_USERNAME
              value: {{ $dbUser | quote }}
            - name: DATABASE_ROOT_USERNAME
              value: {{ $dbUser | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: FUSIONAUTH_DATABASE_PASSWORD
            - name: DATABASE_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: FUSIONAUTH_DATABASE_PASSWORD
            - name: FUSIONAUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: FUSIONAUTH_API_KEY
            {{- if $fa.license.enabled }}
            - name: FUSIONAUTH_LICENSE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $fa.license.secretKey }}
            {{- end }}
            - name: FUSIONAUTH_APP_SILENT_MODE
              value: "true"
            - name: FUSIONAUTH_APP_URL
              value: "http://localhost:9011"
            - name: SEARCH_TYPE
              value: {{ $search.engine | quote }}
            {{- if and $useSearchEngine $search.serversSecretKey }}
            - name: SEARCH_SERVERS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $search.serversSecretKey }}
            {{- else if $useSearchEngine }}
            - name: SEARCH_SERVERS
              value: {{ include "egateway.searchServers" . | quote }}
            {{- end }}
            - name: FUSIONAUTH_APP_KICKSTART_FILE
              value: /usr/local/fusionauth/kickstart/kickstart.json
          {{- if $reindex }}
          lifecycle:
            postStart:
              exec:
                command: ["sh", "/usr/local/fusionauth/kickstart/reindex-if-empty.sh"]
          {{- end }}
          volumeMounts:
            {{- include "composio.databaseTlsMount" . | nindent 12 }}
            - name: kickstart
              mountPath: /usr/local/fusionauth/kickstart
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml $fa.resources | nindent 12 }}
      volumes:
        {{- include "composio.databaseTlsVolume" . | nindent 8 }}
        - name: kickstart
          configMap:
            name: {{ include "egateway.fusionauthServiceName" . }}-kickstart
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "egateway.fusionauthServiceName" . }}
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: egateway-fusionauth
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9011
      targetPort: http
  selector:
    {{- include "composio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: egateway-fusionauth
{{- end }}
