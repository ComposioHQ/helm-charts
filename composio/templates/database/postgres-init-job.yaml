{{- if .Values.databaseMigration.enabled }}
{{- $databaseMigrationUser := printf "\"%s\"" (replace "\"" "\"\"" .Values.databaseMigration.user) }}
{{- $workerDbEnabled := eq (include "composio.thermosWorkerDbEnabled" .) "true" }}
{{- $workerDbDatabaseName := include "composio.thermosWorkerDbDatabaseName" . }}
{{- $workerDbDatabase := printf "\"%s\"" (replace "\"" "\"\"" $workerDbDatabaseName) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "composio.fullname" . }}-db-init-create
  labels:
    {{- include "composio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      name: {{ include "composio.fullname" . }}-db-init-create
    spec:
      restartPolicy: OnFailure
      {{- with .Values.databaseMigration.additionalInitContainers }}
      initContainers:
{{ tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
      - name: postgres-init
        image: {{ .Values.databaseMigration.image }}
        env:
        - name: POSTGRES_INIT_SECRETS_DIR
          value: {{ .Values.databaseMigration.secretsDir | quote }}
        - name: PGHOST
          value: {{ .Values.databaseMigration.host | quote }}
        - name: PGPORT
          value: {{ default "5432" .Values.databaseMigration.port | quote }}
        - name: PGUSER
          value: {{ .Values.databaseMigration.user | quote }}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secret.name }}
              key: {{ .Values.databaseMigration.password.key }}
              optional: true
        - name: PGDATABASE
          value: "postgres"
        args:
        - /bin/sh
        - -c
        - |
          secrets_dir="${POSTGRES_INIT_SECRETS_DIR:-{{ .Values.databaseMigration.secretsDir }}}"
          if [ -f "$secrets_dir/PGPASSWORD" ]; then
            export PGPASSWORD="$(cat "$secrets_dir/PGPASSWORD")"
          fi
          cat <<'EOF' | psql


          -- Create databases
          CREATE DATABASE composiodb;
          {{- if eq (include "composio.temporalEnabled" .) "true" }}
          CREATE DATABASE temporal;
          CREATE DATABASE temporal_visibility;
          {{- end }}
          CREATE DATABASE thermosdb;
          {{- if $workerDbEnabled }}
          CREATE DATABASE {{ $workerDbDatabase }};
          {{- end }}

          -- Alter Database
          ALTER DATABASE composiodb OWNER TO {{ $databaseMigrationUser }};
          {{- if eq (include "composio.temporalEnabled" .) "true" }}
          ALTER DATABASE temporal OWNER TO {{ $databaseMigrationUser }};
          ALTER DATABASE temporal_visibility OWNER TO {{ $databaseMigrationUser }};
          {{- end }}
          ALTER DATABASE thermosdb OWNER TO {{ $databaseMigrationUser }};
          {{- if $workerDbEnabled }}
          ALTER DATABASE {{ $workerDbDatabase }} OWNER TO {{ $databaseMigrationUser }};
          {{- end }}

          -- Grant privileges on thermosdb
          \c thermosdb
          GRANT ALL PRIVILEGES ON DATABASE thermosdb TO {{ $databaseMigrationUser }};
          GRANT ALL PRIVILEGES ON SCHEMA public TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO {{ $databaseMigrationUser }};

          {{- if $workerDbEnabled }}
          -- Grant privileges on Thermos worker DB
          \c {{ $workerDbDatabase }}
          GRANT ALL PRIVILEGES ON DATABASE {{ $workerDbDatabase }} TO {{ $databaseMigrationUser }};
          GRANT ALL PRIVILEGES ON SCHEMA public TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO {{ $databaseMigrationUser }};
          {{- end }}

          -- Grant privileges on composiodb
          \c composiodb
          GRANT ALL PRIVILEGES ON DATABASE composiodb TO {{ $databaseMigrationUser }};
          GRANT ALL PRIVILEGES ON SCHEMA public TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO {{ $databaseMigrationUser }};

          {{- if eq (include "composio.temporalEnabled" .) "true" }}
          -- Grant privileges on temporal
          \c temporal
          GRANT ALL PRIVILEGES ON DATABASE temporal TO {{ $databaseMigrationUser }};
          GRANT ALL PRIVILEGES ON SCHEMA public TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO {{ $databaseMigrationUser }};

          -- Grant privileges on temporal_visibility
          \c temporal_visibility
          GRANT ALL PRIVILEGES ON DATABASE temporal_visibility TO {{ $databaseMigrationUser }};
          GRANT ALL PRIVILEGES ON SCHEMA public TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ $databaseMigrationUser }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO {{ $databaseMigrationUser }};
          {{- end }}

          -- Grant database creation privilege
          \c postgres
          EOF
        volumeMounts:
        - name: postgres-init-secrets
          mountPath: {{ .Values.databaseMigration.secretsDir | quote }}
          readOnly: true
      volumes:
      - name: postgres-init-secrets
        emptyDir: {}
{{- end }}
