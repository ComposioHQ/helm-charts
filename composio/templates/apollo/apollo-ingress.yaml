{{- if .Values.apollo.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "composio.fullname" . }}-apollo-ingress
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: apollo-ingress
  annotations:
    {{- include "composio.apolloIngressAnnotations" . | nindent 4 }}
spec:
  {{- $className := include "composio.apolloIngressClass" . }}
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  rules:
    - host: {{ .Values.apollo.ingress.host | default (printf "apollo.%s" .Values.global.domain) }}
      http:
        paths:
          - path: {{ .Values.apollo.ingress.path | default "/" }}
            pathType: {{ include "composio.apolloIngressPathType" . }}
            backend:
              service:
                name: {{ include "composio.fullname" . }}-apollo
                port:
                  number: {{ .Values.apollo.service.port | default 3000 }}
  {{- $tls := include "composio.apolloIngressTls" . }}
  {{- if $tls }}
  tls:
    {{- $tls | nindent 4 }}
  {{- end }}
{{- end }}
