{{- if .Values.apollo.dbInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-apollo-db-init
  labels:
    app: apollo-db-init
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      name: {{ .Release.Name }}-apollo-db-init
      labels:
        app: apollo-db-init
        release: {{ .Release.Name }}
    spec:
      {{- if .Values.apollo.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.apollo.serviceAccount.name  }}
      {{- end }}
      {{- if .Values.replicated.enabled }}
      {{- include "replicated.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      {{- if not .Values.replicated.enabled }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.apollo.dbInit.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: {{ .Values.dbInit.job.restartPolicy | default "OnFailure" }}
      {{- with .Values.apollo.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apollo.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apollo.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apollo.dbInit.additionalInitContainers }}
      initContainers:
{{ tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: apollo-db-init
          image: {{ include "composio.imageReference" (dict "image" .Values.apollo.dbInit.image "context" .) | quote }}
          imagePullPolicy: {{ .Values.apollo.dbInit.image.pullPolicy }}
          {{- with .Values.apollo.dbInit.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $coreSecret := include "composio.coreSecretName" . }}
            - name: APOLLO_SECRET_DIR
              value: {{ .Values.apollo.secretsDir | quote }}
            # Apollo database URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: POSTGRES_URL
                  optional: true
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: ENCRYPTION_KEY
                  optional: true
            - name: ORG_API_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: ENCRYPTION_KEY
                  optional: true
            - name: ADMIN_EMAIL
              value: {{ .Values.dbInit.adminEmail | default "hello@composio.dev" | quote }}
            # DDL detection gate — set SKIP_DDL_DETECTION=true to bypass for emergency deploys
            - name: SKIP_DDL_DETECTION
              value: {{ .Values.apollo.dbInit.skipDdlDetection | default false | quote }}
            # Peer cluster DB URL for post-migration schema consistency validation.
            # Populated from the core secret when the key exists; omitted (skipped) otherwise.
            - name: PEER_CLUSTER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: PEER_CLUSTER_URL
                  optional: true
            # Extra Liquibase CLI arguments (e.g. "--contexts=ddl --log-level=DEBUG")
            - name: EXTRA_LIQUIBASE_ARGS
              value: {{ .Values.apollo.dbInit.extraLiquibaseArgs | default "" | quote }}
          volumeMounts:
            - name: apollo-secrets
              mountPath: {{ .Values.apollo.secretsDir | quote }}
              readOnly: true
            {{- with .Values.apollo.dbInit.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: apollo-secrets
          emptyDir: {}
        {{- with .Values.apollo.dbInit.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  backoffLimit: {{ .Values.dbInit.job.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ .Values.dbInit.job.activeDeadlineSeconds | default 300 }}
{{- end }}
