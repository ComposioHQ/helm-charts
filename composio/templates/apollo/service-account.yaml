{{- if and .Values.apollo.serviceAccount.enabled (default false .Values.apollo.serviceAccount.create) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.apollo.serviceAccount.name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    {{- with .Values.apollo.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.apollo.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
