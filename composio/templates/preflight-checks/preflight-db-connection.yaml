{{- $disableK8SecretCheck := .Values.global.disableK8SecretCheck | default false }}
{{- if .Values.databaseMigration.enabled }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    troubleshoot.sh/kind: preflight
  name: "{{ .Release.Name }}-preflight-postgres-config"
stringData:
  preflight.yaml: |
    apiVersion: troubleshoot.sh/v1beta2
    kind: Preflight
    metadata:
      name: "{{ .Release.Name }}-postgres-preflight"
    spec:
      {{- if and .Values.databaseMigration.enabled (not $disableK8SecretCheck) }}
      collectors:
        # --- Source PostgreSQL secret referenced by your values ---
        - secret:
            name: "{{ .Values.secret.name }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ .Values.databaseMigration.password.key }}"
            includeValue: false
        {{- range $field := list "host" "user" }}
        {{- $key := index $.Values.databaseMigration (printf "%sSecret" $field) "key" }}
        {{- if $key }}
        - secret:
            name: {{ $.Values.secret.name | quote }}
            namespace: {{ $.Release.Namespace | quote }}
            key: {{ $key | quote }}
            includeValue: false
        {{- end }}
        {{- end }}
        # --- Validate PostgreSQL connection by real connection test ---
        - runPod:
            collectorName: "validate-postgres-connection"
            namespace: "{{ .Release.Namespace }}"
            timeout: 60s
            podSpec:
              restartPolicy: Never
              containers:
                - name: check
                  image: postgres:15-alpine
                  env:
                    - name: PGHOST
                      {{- if .Values.databaseMigration.hostSecret.key }}
                      valueFrom:
                        secretKeyRef:
                          name: {{ .Values.secret.name | quote }}
                          key: {{ .Values.databaseMigration.hostSecret.key | quote }}
                          optional: true
                      {{- else }}
                      value: {{ .Values.databaseMigration.host | quote }}
                      {{- end }}
                    - name: PGPORT
                      value: {{ .Values.databaseMigration.port | quote }}
                    - name: PGUSER
                      {{- if .Values.databaseMigration.userSecret.key }}
                      valueFrom:
                        secretKeyRef:
                          name: {{ .Values.secret.name | quote }}
                          key: {{ .Values.databaseMigration.userSecret.key | quote }}
                          optional: true
                      {{- else }}
                      value: {{ .Values.databaseMigration.user | quote }}
                      {{- end }}
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: "{{ .Values.secret.name }}"
                          key: "{{ .Values.databaseMigration.password.key }}"
                          optional: true
                    - name: PGDATABASE
                      value: "postgres"
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      if [ -z "${PGPASSWORD:-}" ]; then
                        echo "RESULT=MISSING_PASSWORD EXIT_CODE=1"
                        exit 0
                      fi
                      if [ -z "${PGHOST:-}" ] || [ -z "${PGUSER:-}" ]; then
                        echo "RESULT=MISSING_CONFIG EXIT_CODE=1"
                        exit 0
                      fi

                      # Attempt to connect and run a simple query
                      if psql -c "SELECT 1;" > /tmp/output 2>&1; then
                        echo "RESULT=OK EXIT_CODE=0"
                      else
                        EXIT_CODE=$?
                        ERROR=$(cat /tmp/output 2>/dev/null || echo "Unknown error")

                        # Check for common errors
                        if echo "${ERROR}" | grep -qi "authentication failed\|password authentication failed"; then
                          echo "RESULT=AUTH_FAILED EXIT_CODE=${EXIT_CODE}"
                        elif echo "${ERROR}" | grep -qi "could not translate host name\|could not connect\|Connection refused"; then
                          echo "RESULT=CONNECTION_FAILED EXIT_CODE=${EXIT_CODE}"
                        elif echo "${ERROR}" | grep -qi "database.*does not exist"; then
                          echo "RESULT=DB_NOT_FOUND EXIT_CODE=${EXIT_CODE}"
                        elif echo "${ERROR}" | grep -qi "role.*does not exist"; then
                          echo "RESULT=USER_NOT_FOUND EXIT_CODE=${EXIT_CODE}"
                        else
                          echo "RESULT=ERROR EXIT_CODE=${EXIT_CODE}"
                        fi
                      fi
      analyzers:
        - secret:
            checkName: "PostgreSQL password secret present"
            secretName: "{{ .Values.secret.name }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ .Values.databaseMigration.password.key }}"
            outcomes:
              - warn:
                  message: {{ printf "Missing PostgreSQL password Secret %s or key %s." .Values.secret.name .Values.databaseMigration.password.key | quote }}
              - pass:
                  message: {{ printf "Found PostgreSQL password Secret %s (key %s)." .Values.secret.name .Values.databaseMigration.password.key | quote }}
        {{- range $field := list "host" "user" }}
        {{- $key := index $.Values.databaseMigration (printf "%sSecret" $field) "key" }}
        {{- if $key }}
        - secret:
            checkName: {{ printf "PostgreSQL %s secret present" $field | quote }}
            secretName: {{ $.Values.secret.name | quote }}
            namespace: {{ $.Release.Namespace | quote }}
            key: {{ $key | quote }}
            outcomes:
              - warn:
                  message: {{ printf "Missing PostgreSQL %s Secret %s or key %s." $field $.Values.secret.name $key | quote }}
              - pass:
                  message: {{ printf "Found PostgreSQL %s Secret %s (key %s)." $field $.Values.secret.name $key | quote }}
        {{- end }}
        {{- end }}
        - textAnalyze:
            checkName: "PostgreSQL connection is valid"
            fileName: "/validate-postgres-connection.log"
            regexGroups: 'RESULT=(?P<Result>[A-Z_]+) EXIT_CODE=(?P<Code>\d+)'
            outcomes:
              - pass:
                  when: "Result == OK"
                  {{- if .Values.databaseMigration.hostSecret.key }}
                  message: "PostgreSQL connection successful."
                  {{- else }}
                  message: {{ printf "PostgreSQL connection successful to %s:%s." .Values.databaseMigration.host .Values.databaseMigration.port | quote }}
                  {{- end }}
              - fail:
                  when: "Result == AUTH_FAILED"
                  {{- if .Values.databaseMigration.userSecret.key }}
                  message: {{ printf "PostgreSQL authentication failed. Check username in Secret %s (key %s) and password in Secret %s." .Values.secret.name .Values.databaseMigration.userSecret.key .Values.secret.name | quote }}
                  {{- else }}
                  message: {{ printf "PostgreSQL authentication failed. Check username (%s) and password in secret %s." .Values.databaseMigration.user .Values.secret.name | quote }}
                  {{- end }}
              - fail:
                  when: "Result == CONNECTION_FAILED"
                  {{- if .Values.databaseMigration.hostSecret.key }}
                  message: {{ printf "Cannot connect to PostgreSQL. Check host in Secret %s (key %s), port %s, and network connectivity." .Values.secret.name .Values.databaseMigration.hostSecret.key .Values.databaseMigration.port | quote }}
                  {{- else }}
                  message: {{ printf "Cannot connect to PostgreSQL at %s:%s. Check host, port, and network connectivity." .Values.databaseMigration.host .Values.databaseMigration.port | quote }}
                  {{- end }}
              - fail:
                  when: "Result == USER_NOT_FOUND"
                  {{- if .Values.databaseMigration.userSecret.key }}
                  message: {{ printf "PostgreSQL user configured in Secret %s (key %s) does not exist on the database server." .Values.secret.name .Values.databaseMigration.userSecret.key | quote }}
                  {{- else }}
                  message: {{ printf "PostgreSQL user '%s' does not exist on the database server." .Values.databaseMigration.user | quote }}
                  {{- end }}
              - fail:
                  when: "Result == DB_NOT_FOUND"
                  message: "PostgreSQL database 'postgres' does not exist. This is unusual and may indicate server misconfiguration."
              - warn:
                  when: "Result == MISSING_PASSWORD"
                  message: {{ printf "PostgreSQL password not found in secret %s." .Values.secret.name | quote }}
              - fail:
                  when: "Result == MISSING_CONFIG"
                  message: "PostgreSQL connection configuration incomplete. Check host, port, and user values."
              - fail:
                  message: "PostgreSQL connection test failed"
      {{- else }}
      collectors: []
      analyzers: []
      {{- end }}
{{- end }}
