{{- $disableK8SecretCheck := .Values.global.disableK8SecretCheck | default false }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    troubleshoot.sh/kind: preflight
  annotations:
    kots.io/when: "true"
  name: "{{ .Release.Name }}-preflight-config"
stringData:
  preflight.yaml: |
    apiVersion: troubleshoot.sh/v1beta2
    kind: Preflight
    metadata:
      name: "{{ .Release.Name }}-preflight-config"
    spec:
      {{- if $disableK8SecretCheck }}
      collectors: []
      analyzers: []
      {{- else }}
      {{- $coreSecret := include "composio.coreSecretName" . }}
      {{- $externalRedis := .Values.externalRedis | default (dict) }}
      {{- $externalRedisSentinel := $externalRedis.sentinel | default (dict) }}
      {{- $externalRedisSentinelEnabled := and $externalRedis.enabled $externalRedisSentinel.enabled }}
      {{- $externalRedisSentinelSecretRef := $externalRedisSentinel.secretRef | default $externalRedis.secretRef }}
      collectors:
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "COMPOSIO_ADMIN_TOKEN"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "ENCRYPTION_KEY"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "JWT_SECRET"
            includeValue: false
        {{- if eq (include "composio.temporalEnabled" .) "true" }}
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "TEMPORAL_TRIGGER_ENCRYPTION_KEY"
            includeValue: false
        {{- end }}
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "POSTGRES_URL"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "THERMOS_DATABASE_URL"
            includeValue: false
        {{- if and $externalRedis.enabled (not $externalRedisSentinelEnabled) }}
        - secret:
            name: "{{ $externalRedis.secretRef }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ $externalRedis.key }}"
            includeValue: false
        {{- end }}
        {{- if and $externalRedisSentinelEnabled $externalRedisSentinel.usernameKey }}
        - secret:
            name: "{{ $externalRedisSentinelSecretRef }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ $externalRedisSentinel.usernameKey }}"
            includeValue: false
        {{- end }}
        {{- if and $externalRedisSentinelEnabled $externalRedisSentinel.passwordKey }}
        - secret:
            name: "{{ $externalRedisSentinelSecretRef }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ $externalRedisSentinel.passwordKey }}"
            includeValue: false
        {{- end }}
        {{- if and $externalRedisSentinelEnabled $externalRedisSentinel.sentinelPasswordKey }}
        - secret:
            name: "{{ $externalRedisSentinelSecretRef }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ $externalRedisSentinel.sentinelPasswordKey }}"
            includeValue: false
        {{- end }}

      analyzers:
        # --- Chart-managed secrets ---
        - secret:
            checkName: "Apollo admin token secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "COMPOSIO_ADMIN_TOKEN"
            outcomes:
              - warn:
                  message: "Missing {{ $coreSecret }} or key COMPOSIO_ADMIN_TOKEN. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $coreSecret }} (COMPOSIO_ADMIN_TOKEN)."

        - secret:
            checkName: "Encryption key secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "ENCRYPTION_KEY"
            outcomes:
              - warn:
                  message: "Missing {{ $coreSecret }} or key ENCRYPTION_KEY. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $coreSecret }} (ENCRYPTION_KEY)."

        - secret:
            checkName: "JWT secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "JWT_SECRET"
            outcomes:
              - warn:
                  message: "Missing {{ $coreSecret }} or key JWT_SECRET. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $coreSecret }} (JWT_SECRET)."

        {{- if eq (include "composio.temporalEnabled" .) "true" }}
        - secret:
            checkName: "Temporal encryption key secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "TEMPORAL_TRIGGER_ENCRYPTION_KEY"
            outcomes:
              - warn:
                  message: "Missing {{ $coreSecret }} or key TEMPORAL_TRIGGER_ENCRYPTION_KEY. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $coreSecret }} (TEMPORAL_TRIGGER_ENCRYPTION_KEY)."
        {{- end }}
        - secret:
            checkName: "Apollo Postgres URL present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "POSTGRES_URL"
            outcomes:
              - warn:
                  message: "Missing {{ $coreSecret }} or key POSTGRES_URL. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $coreSecret }} (POSTGRES_URL)."
        - secret:
            checkName: "Thermos Postgres URL present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "THERMOS_DATABASE_URL"
            outcomes:
              - warn:
                  message: "Missing {{ $coreSecret }} or key THERMOS_DATABASE_URL. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $coreSecret }} (THERMOS_DATABASE_URL)."
        {{- if and $externalRedis.enabled (not $externalRedisSentinelEnabled) }}
        - secret:
            checkName: "Redis URL present"
            secretName: "{{ $externalRedis.secretRef }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ $externalRedis.key }}"
            outcomes:
              - warn:
                  message: "Missing {{ $externalRedis.secretRef }} or key {{ $externalRedis.key }}. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $externalRedis.secretRef }} ({{ $externalRedis.key }})."
        {{- end }}
        {{- if and $externalRedisSentinelEnabled $externalRedisSentinel.usernameKey }}
        - secret:
            checkName: "Redis Sentinel username present"
            secretName: "{{ $externalRedisSentinelSecretRef }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ $externalRedisSentinel.usernameKey }}"
            outcomes:
              - warn:
                  message: "Missing {{ $externalRedisSentinelSecretRef }} or key {{ $externalRedisSentinel.usernameKey }}. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $externalRedisSentinelSecretRef }} ({{ $externalRedisSentinel.usernameKey }})."
        {{- end }}
        {{- if and $externalRedisSentinelEnabled $externalRedisSentinel.passwordKey }}
        - secret:
            checkName: "Redis Sentinel password present"
            secretName: "{{ $externalRedisSentinelSecretRef }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ $externalRedisSentinel.passwordKey }}"
            outcomes:
              - warn:
                  message: "Missing {{ $externalRedisSentinelSecretRef }} or key {{ $externalRedisSentinel.passwordKey }}. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $externalRedisSentinelSecretRef }} ({{ $externalRedisSentinel.passwordKey }})."
        {{- end }}
        {{- if and $externalRedisSentinelEnabled $externalRedisSentinel.sentinelPasswordKey }}
        - secret:
            checkName: "Redis Sentinel auth password present"
            secretName: "{{ $externalRedisSentinelSecretRef }}"
            namespace: "{{ .Release.Namespace }}"
            key: "{{ $externalRedisSentinel.sentinelPasswordKey }}"
            outcomes:
              - warn:
                  message: "Missing {{ $externalRedisSentinelSecretRef }} or key {{ $externalRedisSentinel.sentinelPasswordKey }}. This warning only applies when using Kubernetes Secret-based configuration. If you provide this value via init containers/file-mounted secrets, you can ignore this warning or set global.disableK8SecretCheck=true."
              - pass:
                  message: "Found {{ $externalRedisSentinelSecretRef }} ({{ $externalRedisSentinel.sentinelPasswordKey }})."
        {{- end }}
      {{- end }}
