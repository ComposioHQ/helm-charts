apiVersion: v1
kind: Secret
metadata:
  labels:
    troubleshoot.sh/kind: preflight
  annotations:
    kots.io/when: "true"
  name: "{{ .Release.Name }}-preflight-config"
stringData:
  preflight.yaml: |
    apiVersion: troubleshoot.sh/v1beta2
    kind: Preflight
    metadata:
      name: "{{ .Release.Name }}-preflight-config"
    spec:
      {{- $coreSecret := include "composio.coreSecretName" . }}
      collectors:
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "APOLLO_ADMIN_TOKEN"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "COMPOSIO_API_KEY"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "ENCRYPTION_KEY"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "JWT_SECRET"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "TEMPORAL_TRIGGER_ENCRYPTION_KEY"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "POSTGRES_URL"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "THERMOS_DATABASE_URL"
            includeValue: false
        - secret:
            name: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "REDIS_URL"
            includeValue: false

        - runPod:
            collectorName: "validate-postgres-apollo-core"
            namespace: "{{ .Release.Namespace }}"
            timeout: 60s
            podSpec:
              restartPolicy: Never
              containers:
                - name: check
                  image: postgres:16-alpine
                  env:
                    - name: DATABASE_URL
                      valueFrom:
                        secretKeyRef:
                          name: "{{ $coreSecret }}"
                          key: "POSTGRES_URL"
                          optional: true
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      if [ -z "${DATABASE_URL:-}" ]; then
                        echo "RESULT=MISSING"
                        exit 0
                      fi
                      if psql "${DATABASE_URL}" -Atqc "select 1" >/dev/null 2>&1; then
                        echo "RESULT=OK"
                      else
                        echo "RESULT=ERROR"
                      fi

        - runPod:
            collectorName: "validate-postgres-thermos-core"
            namespace: "{{ .Release.Namespace }}"
            timeout: 60s
            podSpec:
              restartPolicy: Never
              containers:
                - name: check
                  image: postgres:16-alpine
                  env:
                    - name: DATABASE_URL
                      valueFrom:
                        secretKeyRef:
                          name: "{{ $coreSecret }}"
                          key: "THERMOS_DATABASE_URL"
                          optional: true
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      if [ -z "${DATABASE_URL:-}" ]; then
                        echo "RESULT=MISSING"
                        exit 0
                      fi
                      if psql "${DATABASE_URL}" -Atqc "select 1" >/dev/null 2>&1; then
                        echo "RESULT=OK"
                      else
                        echo "RESULT=ERROR"
                      fi

        - runPod:
            collectorName: "validate-redis-core"
            namespace: "{{ .Release.Namespace }}"
            timeout: 60s
            podSpec:
              restartPolicy: Never
              containers:
                - name: check
                  image: redis:7-alpine
                  env:
                    - name: REDIS_URL
                      valueFrom:
                        secretKeyRef:
                          name: "{{ $coreSecret }}"
                          key: "REDIS_URL"
                          optional: true
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      if [ -z "${REDIS_URL:-}" ]; then
                        echo "RESULT=MISSING"
                        exit 0
                      fi
                      # redis-cli supports URL via -u
                      if redis-cli -u "${REDIS_URL}" PING >/dev/null 2>&1; then
                        echo "RESULT=OK"
                      else
                        echo "RESULT=ERROR"
                      fi

      analyzers:
        # --- Chart-managed secrets ---
        - secret:
            checkName: "Apollo admin token secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "APOLLO_ADMIN_TOKEN"
            outcomes:
              - fail:
                  message: "Missing {{ $coreSecret }} or key APOLLO_ADMIN_TOKEN."
              - pass:
                  message: "Found {{ $coreSecret }} (APOLLO_ADMIN_TOKEN)."

        - secret:
            checkName: "Composio API key secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "COMPOSIO_API_KEY"
            outcomes:
              - fail:
                  message: "Missing {{ $coreSecret }} or key COMPOSIO_API_KEY."
              - pass:
                  message: "Found {{ $coreSecret }} (COMPOSIO_API_KEY)."

        - secret:
            checkName: "Encryption key secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "ENCRYPTION_KEY"
            outcomes:
              - fail:
                  message: "Missing {{ $coreSecret }} or key ENCRYPTION_KEY."
              - pass:
                  message: "Found {{ $coreSecret }} (ENCRYPTION_KEY)."

        - secret:
            checkName: "JWT secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "JWT_SECRET"
            outcomes:
              - fail:
                  message: "Missing {{ $coreSecret }} or key JWT_SECRET."
              - pass:
                  message: "Found {{ $coreSecret }} (JWT_SECRET)."

        - secret:
            checkName: "Temporal encryption key secret present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "TEMPORAL_TRIGGER_ENCRYPTION_KEY"
            outcomes:
              - fail:
                  message: "Missing {{ $coreSecret }} or key TEMPORAL_TRIGGER_ENCRYPTION_KEY."
              - pass:
                  message: "Found {{ $coreSecret }} (TEMPORAL_TRIGGER_ENCRYPTION_KEY)."
        - secret:
            checkName: "Apollo Postgres URL present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "POSTGRES_URL"
            outcomes:
              - fail:
                  message: "Missing {{ $coreSecret }} or key POSTGRES_URL."
              - pass:
                  message: "Found {{ $coreSecret }} (POSTGRES_URL)."
        - secret:
            checkName: "Thermos Postgres URL present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "THERMOS_DATABASE_URL"
            outcomes:
              - fail:
                  message: "Missing {{ $coreSecret }} or key THERMOS_DATABASE_URL."
              - pass:
                  message: "Found {{ $coreSecret }} (THERMOS_DATABASE_URL)."
        - secret:
            checkName: "Redis URL present"
            secretName: "{{ $coreSecret }}"
            namespace: "{{ .Release.Namespace }}"
            key: "REDIS_URL"
            outcomes:
              - fail:
                  message: "Missing {{ $coreSecret }} or key REDIS_URL."
              - pass:
                  message: "Found {{ $coreSecret }} (REDIS_URL)."
        - textAnalyze:
            checkName: "Apollo Postgres connectivity (core secret)"
            fileName: "validate-postgres-apollo-core.log"
            regexGroups: 'Result=(?P<Result>[A-Za-z_]+)'
            ignoreIfNoFiles: true
            outcomes:
              - pass:
                  when: '.Result == "OK"'
                  message: "Can connect to Apollo Postgres via core secret."
              - fail:
                  when: '.Result == "ERROR"'
                  message: "Cannot connect to Apollo Postgres via core secret (check URL/creds/network)."
              - warn:
                  when: '.Result == "MISSING"'
                  message: "Apollo Postgres URL missing in core secret."
              - fail:
                  message: "Apollo Postgres connectivity result not found in preflight output."
        - textAnalyze:
            checkName: "Thermos Postgres connectivity (core secret)"
            fileName: "validate-postgres-thermos-core.log"
            regexGroups: 'Result=(?P<Result>[A-Za-z_]+)'
            ignoreIfNoFiles: true
            outcomes:
              - pass:
                  when: '.Result == "OK"'
                  message: "Can connect to Thermos Postgres via core secret."
              - fail:
                  when: '.Result == "ERROR"'
                  message: "Cannot connect to Thermos Postgres via core secret (check URL/creds/network)."
              - warn:
                  when: '.Result == "MISSING"'
                  message: "Thermos Postgres URL missing in core secret."
              - fail:
                  message: "Thermos Postgres connectivity result not found in preflight output."
        - textAnalyze:
            checkName: "Redis connectivity (core secret)"
            fileName: "validate-redis-core.log"
            regexGroups: '^RESULT=(?P<Result>[A-Z_]+)'
            outcomes:
              - pass:
                  when: '.Result == "OK"'
                  message: "Can connect to Redis via core secret."
              - fail:
                  when: '.Result == "ERROR"'
                  message: "Cannot connect to Redis via core secret (check URL/creds/network)."
              - warn:
                  when: '.Result == "MISSING"'
                  message: "Redis URL missing in core secret."
              - fail:
                  message: "Redis connectivity result not found in preflight output."
