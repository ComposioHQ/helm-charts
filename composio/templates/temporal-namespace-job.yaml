{{- $temporalEnabled := eq (include "composio.temporalEnabled" .) "true" -}}
{{- if and $temporalEnabled .Values.temporal.server.config.namespaces.create -}}
{{- fail "temporal.server.config.namespaces.create must remain false because the parent Composio chart manages Temporal namespaces" -}}
{{- end -}}
{{- $namespaces := include "composio.temporal.namespaces" . | fromYamlArray -}}
{{- if and $temporalEnabled $namespaces }}
{{- $component := printf "namespaces-%v" .Release.Revision | replace "." "-" -}}
{{- $jobName := include "composio.temporal.componentName" (list . $component) -}}
{{- $temporalName := default "temporal" .Values.temporal.nameOverride | trunc 63 | trimSuffix "-" -}}
{{- $serviceAccountName := default "default" .Values.temporal.serviceAccount.name -}}
{{- if .Values.temporal.serviceAccount.create -}}
{{- $serviceAccountName = default (include "composio.temporal.fullname" .) .Values.temporal.serviceAccount.name -}}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  namespace: {{ include "composio.namespace" . }}
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: {{ $temporalName }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: temporal
    {{- with .Values.temporal.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.temporal.schema.jobAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.temporal.schema.setup.backoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      name: {{ $jobName }}
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: {{ $temporalName }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: temporal
        {{- with .Values.temporal.additionalLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.temporal.schema.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.temporal.schema.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      restartPolicy: OnFailure
      initContainers:
        {{- with .Values.temporal.admintools.additionalInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: wait-for-frontend
          image: "{{ .Values.temporal.admintools.image.repository }}:{{ .Values.temporal.admintools.image.tag }}"
          imagePullPolicy: {{ .Values.temporal.admintools.image.pullPolicy }}
          command: ['/bin/sh', '-c']
          args:
            - 'until temporal operator namespace list >/dev/null 2>&1; do echo waiting for temporal frontend to start; sleep 5; done;'
          env:
            - name: TEMPORAL_ADDRESS
              {{- if and (hasKey .Values.temporal.server "internalFrontend") .Values.temporal.server.internalFrontend.enabled }}
              value: {{ include "composio.temporal.fullname" . }}-internal-frontend.{{ .Release.Namespace }}.svc:{{ .Values.temporal.server.internalFrontend.service.port }}
              {{- else if .Values.temporal.server.frontend.ingress.enabled }}
              value: {{ index .Values.temporal.server.frontend.ingress.hosts 0 | quote }}
              {{- else }}
              value: {{ printf "%s-frontend.%s.svc:%v" (include "composio.temporal.fullname" .) .Release.Namespace .Values.temporal.server.frontend.service.port | quote }}
              {{- end }}
              {{- with .Values.temporal.admintools.additionalEnv }}
              {{- toYaml . | nindent 12 }}
              {{- end }}
              {{- with .Values.temporal.admintools.additionalEnvSecretName }}
          envFrom:
            - secretRef:
                name: {{ . }}
              {{- end }}
              {{- with .Values.temporal.admintools.additionalVolumeMounts }}
          volumeMounts:
                {{- toYaml . | nindent 12 }}
              {{- end }}
              {{- with .Values.temporal.schema.resources }}
          resources:
                {{- toYaml . | nindent 12 }}
              {{- end }}
              {{- with .Values.temporal.schema.containerSecurityContext }}
          securityContext:
                {{- toYaml . | nindent 12 }}
              {{- end }}
        {{- range $namespace := $namespaces }}
        - name: create-{{ $namespace.name }}-namespace
          image: "{{ $.Values.temporal.admintools.image.repository }}:{{ $.Values.temporal.admintools.image.tag }}"
          imagePullPolicy: {{ $.Values.temporal.admintools.image.pullPolicy }}
          command: ['/bin/sh', '-c']
          args: ['temporal operator namespace describe -n {{ $namespace.name }} || temporal operator namespace create -n {{ $namespace.name }}{{- if hasKey $namespace "retention" }} --retention {{ $namespace.retention }}{{- end }}']
          env:
            - name: TEMPORAL_ADDRESS
              {{- if and (hasKey $.Values.temporal.server "internalFrontend") $.Values.temporal.server.internalFrontend.enabled }}
              value: {{ include "composio.temporal.fullname" $ }}-internal-frontend.{{ $.Release.Namespace }}.svc:{{ $.Values.temporal.server.internalFrontend.service.port }}
              {{- else if $.Values.temporal.server.frontend.ingress.enabled }}
              value: {{ index $.Values.temporal.server.frontend.ingress.hosts 0 | quote }}
              {{- else }}
              value: {{ printf "%s-frontend.%s.svc:%v" (include "composio.temporal.fullname" $) $.Release.Namespace $.Values.temporal.server.frontend.service.port | quote }}
              {{- end }}
              {{- with $.Values.temporal.admintools.additionalEnv }}
              {{- toYaml . | nindent 12 }}
              {{- end }}
              {{- with $.Values.temporal.admintools.additionalEnvSecretName }}
          envFrom:
            - secretRef:
                name: {{ . }}
              {{- end }}
              {{- with $.Values.temporal.admintools.additionalVolumeMounts }}
          volumeMounts:
                {{- toYaml . | nindent 12 }}
              {{- end }}
              {{- with $.Values.temporal.schema.resources }}
          resources:
                {{- toYaml . | nindent 12 }}
              {{- end }}
              {{- with $.Values.temporal.schema.containerSecurityContext }}
          securityContext:
                {{- toYaml . | nindent 12 }}
              {{- end }}
        {{- end }}
      containers:
        - name: done
          image: "{{ .Values.temporal.admintools.image.repository }}:{{ .Values.temporal.admintools.image.tag }}"
          imagePullPolicy: {{ .Values.temporal.admintools.image.pullPolicy }}
          command: ['sh', '-c', 'echo "Namespace setup completed"']
          {{- with .Values.temporal.schema.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.temporal.schema.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.temporal.schema.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.temporal.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.temporal.admintools.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.temporal.admintools.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.temporal.admintools.additionalVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
