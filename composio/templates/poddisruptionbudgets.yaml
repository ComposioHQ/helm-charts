{{- $apolloPdb := include "composio.podDisruptionBudget" (dict
  "root" .
  "name" (printf "%s-apollo-pdb" .Release.Name)
  "labels" (dict "app" "apollo" "release" .Release.Name)
  "selectorLabels" (dict "app" "apollo" "release" .Release.Name)
  "pdb" (.Values.apollo.podDisruptionBudget | default (dict))
) -}}
{{- if $apolloPdb }}
{{ $apolloPdb }}
{{- end }}
{{- if .Values.frontend.enabled }}
{{- $frontendPdb := include "composio.podDisruptionBudget" (dict
  "root" .
  "name" (printf "%s-frontend-pdb" (include "composio.fullname" .))
  "labels" (merge (include "composio.labels" . | fromYaml) (dict "app.kubernetes.io/component" "frontend"))
  "selectorLabels" (dict "app.kubernetes.io/component" "frontend")
  "pdb" (.Values.frontend.podDisruptionBudget | default (dict))
) -}}
{{- if $frontendPdb }}
---
{{ $frontendPdb }}
{{- end }}
{{- end }}
