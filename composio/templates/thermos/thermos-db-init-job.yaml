{{- if .Values.thermos.dbInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-thermos-db-init
  labels:
    app: thermos-db-init
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      name: {{ .Release.Name }}-thermos-db-init
      labels:
        app: thermos-db-init
        release: {{ .Release.Name }}
    spec:
      {{- if .Values.thermos.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.thermos.serviceAccount.name }}
      {{- end }}
      {{- if .Values.replicated.enabled }}
      {{- include "replicated.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      {{- if not .Values.replicated.enabled }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.thermos.dbInit.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: {{ .Values.dbInit.job.restartPolicy | default "OnFailure" }}
      {{- with .Values.thermos.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.thermos.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.thermos.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.thermos.dbInit.additionalInitContainers }}
      initContainers:
{{ tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: thermos-db-init
          image: {{ include "composio.imageReference" (dict "image" .Values.thermos.dbInit.image "context" .) | quote }}
          imagePullPolicy: {{ .Values.thermos.dbInit.image.pullPolicy }}
          {{- with .Values.thermos.dbInit.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $coreSecret := include "composio.coreSecretName" . }}
            - name: THERMOS_SECRET_DIR
              value: {{ .Values.thermos.secretsDir | quote }}
            # Thermos database URL
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: THERMOS_DATABASE_URL
                  optional: true
            # Keep DATABASE_URL for backward compatibility with Atlas
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: THERMOS_DATABASE_URL
                  optional: true
            - name: THERMOS_WORKER_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "composio.thermosWorkerDbSecretName" . }}
                  key: {{ include "composio.thermosWorkerDbSecretKey" . }}
                  optional: true
            - name: THERMOS_WORKER_DB_SCHEMA
              value: {{ include "composio.thermosWorkerDbSchema" . | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.dbInit.adminEmail | default "hello@composio.dev" | quote }}
            # When toolkit-registry sidecar is enabled (default), the
            # thermos-db-init job runs Atlas migrations only — toolkit data is
            # served by the standalone thermos-toolkit-registry Postgres. When
            # disabled, the db-init container also restores the SQL dump baked
            # into the image into DATABASE_URL.
            #
            # Defaults to "true" when the toolkitRegistry stanza is absent.
            # Note: `default true X` doesn't help here because Helm's default
            # treats `false` as the zero value, so `false` would round-trip to
            # `true`. Use explicit hasKey instead.
            {{- $registryEnabled := true -}}
            {{- if and .Values.toolkitRegistry (hasKey .Values.toolkitRegistry "enabled") -}}
              {{- $registryEnabled = .Values.toolkitRegistry.enabled -}}
            {{- end }}
            - name: TOOLKIT_REGISTRY_ENABLED
              value: {{ $registryEnabled | quote }}
            {{- if .Values.thermos.dbInit.extraAtlasFlags }}
            - name: EXTRA_ATLAS_FLAGS
              value: {{ .Values.thermos.dbInit.extraAtlasFlags | quote }}
            {{- end }}
            {{- with .Values.thermos.dbInit.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: thermos-secrets
              mountPath: {{ .Values.thermos.secretsDir | quote }}
              readOnly: true
            {{- with .Values.thermos.dbInit.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: thermos-secrets
          emptyDir: {}
        {{- with .Values.thermos.dbInit.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  backoffLimit: {{ .Values.dbInit.job.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ .Values.dbInit.job.activeDeadlineSeconds | default 300 }}
{{- end }}
