apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-thermos
  labels:
    app: thermos
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.thermos.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: thermos
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: thermos
        release: {{ .Release.Name }}
    spec:
      {{- if .Values.thermos.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.thermos.serviceAccount.name }}
      {{- end }}
      {{- if .Values.replicated.enabled }}
      {{- include "replicated.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      {{- if not .Values.replicated.enabled }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.thermos.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.thermos.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.thermos.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.thermos.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.toolkitRegistry.enabled .Values.thermos.additionalInitContainers }}
      initContainers:
        {{- if .Values.toolkitRegistry.enabled }}
        - name: wait-for-toolkit-registry
          image: {{ include "composio.imageReference" (dict "image" .Values.toolkitRegistry.image "context" .) | quote }}
          imagePullPolicy: {{ .Values.toolkitRegistry.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              i=0
              max_attempts=60
              until pg_isready -h {{ .Release.Name }}-toolkit-registry -p {{ .Values.toolkitRegistry.service.port | int }} -U {{ .Values.toolkitRegistry.auth.username }} -d {{ .Values.toolkitRegistry.database.name }}; do
                i=$((i+1))
                if [ "$i" -ge "$max_attempts" ]; then
                  echo "toolkit registry not ready after $max_attempts attempts, giving up"
                  exit 1
                fi
                echo "waiting for toolkit registry (attempt $i/$max_attempts)"
                sleep 2
              done
              echo "toolkit registry is ready after $i attempt(s)"
        {{- end }}
        {{- with .Values.thermos.additionalInitContainers }}
{{ tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: thermos
          image: {{ include "composio.imageReference" (dict "image" .Values.thermos.image "context" .) | quote }}
          imagePullPolicy: {{ .Values.thermos.image.pullPolicy }}
          args: ["/usr/local/bin/thermos", "--cache-dir", "/tmp/.lookup"]
          workingDir: "/tmp"
          {{- with .Values.thermos.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8180
          livenessProbe:
            httpGet:
              path: /api
              port: 8180
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api
              port: 8180
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-thermos-config
          env:
            {{- $coreSecret := include "composio.coreSecretName" . }}
            - name: THERMOS_SECRET_DIR
              value: {{ .Values.thermos.secretsDir | quote }}
            - name: APOLLO_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: COMPOSIO_ADMIN_TOKEN
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: THERMOS_DATABASE_URL
                  optional: true
            - name: THERMOS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: THERMOS_DATABASE_URL
                  optional: true
            - name: POLLING_TRIGGER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: TEMPORAL_TRIGGER_ENCRYPTION_KEY
                  optional: true
            - name: WEBHOOK_PAYLOAD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $coreSecret }}
                  key: TEMPORAL_TRIGGER_ENCRYPTION_KEY
                  optional: true
            {{- if .Values.toolkitRegistry.enabled }}
            - name: TOOLKIT_REGISTRY_DB_URL
              value: {{ printf "postgresql://%s@%s-toolkit-registry:%v/%s?sslmode=disable" .Values.toolkitRegistry.auth.username .Release.Name (.Values.toolkitRegistry.service.port | int) .Values.toolkitRegistry.database.name | quote }}
            {{- end }}
            {{- if .Values.thermos.env }}
            {{- toYaml .Values.thermos.env | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: thermos-secrets
              mountPath: {{ .Values.thermos.secretsDir | quote }}
              readOnly: true
            - name: cache-volume
              mountPath: /tmp
            {{- with .Values.thermos.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.thermos.resources | nindent 12 }}
      volumes:
        - name: thermos-secrets
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        {{- with .Values.thermos.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-thermos
  labels:
    app: thermos
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.thermos.service.type }}
  ports:
    - port: {{ .Values.thermos.service.port }}
      targetPort: 8180
      protocol: TCP
  selector:
    app: thermos
    release: {{ .Release.Name }}
---
{{- if .Values.thermos.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-thermos
  labels:
    app: thermos
    release: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-thermos
  minReplicas: {{ .Values.thermos.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ .Values.thermos.autoscaling.maxReplicas | default 10 }}
  metrics:
    {{- if .Values.thermos.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.thermos.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.thermos.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.thermos.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.thermos.autoscaling.scaleDownStabilizationWindowSeconds | default 300 }}
      policies:
      - type: Percent
        value: {{ .Values.thermos.autoscaling.scaleDownPercent | default 10 }}
        periodSeconds: {{ .Values.thermos.autoscaling.scaleDownPeriodSeconds | default 60 }}
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.thermos.autoscaling.scaleUpStabilizationWindowSeconds | default 60 }}
      policies:
      - type: Percent
        value: {{ .Values.thermos.autoscaling.scaleUpPercent | default 100 }}
        periodSeconds: {{ .Values.thermos.autoscaling.scaleUpPeriodSeconds | default 15 }}
      - type: Pods
        value: {{ .Values.thermos.autoscaling.scaleUpPods | default 4 }}
        periodSeconds: {{ .Values.thermos.autoscaling.scaleUpPeriodSeconds | default 15 }}
      selectPolicy: Max
{{- end }}
