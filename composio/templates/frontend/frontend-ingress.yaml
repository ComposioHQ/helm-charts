{{- if and .Values.frontend.enabled .Values.frontend.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "composio.fullname" . }}-frontend-ingress
  namespace: {{ include "composio.namespace" . }}
  labels:
    {{- include "composio.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend-ingress
  annotations:
    {{- include "composio.frontendIngressAnnotations" . | nindent 4 }}
spec:
  {{- $className := include "composio.frontendIngressClass" . }}
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  rules:
    - host: {{ .Values.frontend.ingress.host | default (printf "app.%s" .Values.global.domain) }}
      http:
        paths:
          - path: {{ .Values.frontend.ingress.path | default "/" }}
            pathType: {{ include "composio.frontendIngressPathType" . }}
            backend:
              service:
                name: {{ include "composio.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port | default 3000 }}
  {{- $tls := include "composio.frontendIngressTls" . }}
  {{- if $tls }}
  tls:
    {{- $tls | nindent 4 }}
  {{- end }}
{{- end }}
