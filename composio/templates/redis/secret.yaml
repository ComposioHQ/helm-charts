{{- if and .Values.redis.enabled .Values.redis.auth.enabled .Values.redis.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "composio.redis.fullname" . }}
  namespace: {{ include "composio.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "composio.redis.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  password: {{ .Values.redis.auth.password | quote }}
{{- end }}
