{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "composio.redis.fullname" . }}-master
  namespace: {{ include "composio.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "composio.redis.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: master
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "composio.redis.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: master
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
