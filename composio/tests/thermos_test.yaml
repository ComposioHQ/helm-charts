suite: test thermos deployment
templates:
  - thermos/thermos.yaml
tests:
  - it: should create thermos deployment
    documentIndex: 1
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-thermos
      - equal:
          path: metadata.labels.app
          value: thermos
      - equal:
          path: metadata.labels.release
          value: RELEASE-NAME

  - it: should have correct replica count
    documentIndex: 1
    set:
      thermos.replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should use correct image
    documentIndex: 1
    set:
      thermos.image.repository: test-thermos
      thermos.image.tag: latest
      thermos.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test-thermos:latest
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should have correct port configuration
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8180

  - it: should have correct resource configuration
    documentIndex: 1
    set:
      thermos.resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "1Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"

  - it: should include image pull secrets when configured
    documentIndex: 1
    set:
      global.imagePullSecrets:
        - name: thermos-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: thermos-secret

  - it: should have rolling update strategy
    documentIndex: 1
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: should wire toolkit registry db url only when enabled
    documentIndex: 1
    set:
      toolkitRegistry.enabled: true
      toolkitRegistry.image.repository: composio-self-host/thermos-toolkit-registry
      toolkitRegistry.image.tag: pr-tag
      toolkitRegistry.image.pullPolicy: IfNotPresent
      toolkitRegistry.auth.username: registry_reader
      toolkitRegistry.auth.password: registry_reader
      toolkitRegistry.service.port: 5432
      toolkitRegistry.database.name: thermos
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOOLKIT_REGISTRY_DB_URL
            value: postgresql://registry_reader:registry_reader@RELEASE-NAME-toolkit-registry:5432/thermos?sslmode=disable
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-toolkit-registry
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: artifacts.composio.io/proxy/composio-rodent/008971668139.dkr.ecr.us-east-1.amazonaws.com/composio-self-host/thermos-toolkit-registry:pr-tag

---
suite: test thermos service
templates:
  - thermos/thermos.yaml
tests:
  - it: should create thermos service
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-thermos
      - equal:
          path: metadata.labels.app
          value: thermos

  - it: should have correct service configuration
    documentIndex: 0
    set:
      thermos.service.type: ClusterIP
      thermos.service.port: 8180
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8180
      - equal:
          path: spec.ports[0].targetPort
          value: 8180

---
suite: test toolkit registry resources
templates:
  - thermos/toolkit-registry.yaml
tests:
  - it: should not render toolkit registry when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render toolkit registry deployment and service when enabled
    set:
      toolkitRegistry.enabled: true
      toolkitRegistry.image.repository: composio-self-host/thermos-toolkit-registry
      toolkitRegistry.image.tag: pr-tag
      toolkitRegistry.service.port: 5432
      toolkitRegistry.auth.username: registry_reader
      toolkitRegistry.database.name: thermos
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Deployment
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-toolkit-registry
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].image
          value: artifacts.composio.io/proxy/composio-rodent/008971668139.dkr.ecr.us-east-1.amazonaws.com/composio-self-host/thermos-toolkit-registry:pr-tag
        documentIndex: 0
      - isKind:
          of: Service
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 5432
        documentIndex: 1
