suite: test core preflight secret checks
templates:
  - preflight-checks/preflight-config.yaml
tests:
  - it: should disable Kubernetes secret checks in core preflight
    set:
      global.disableK8SecretCheck: true
    asserts:
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: '(?s)collectors:\s*\[\]'
      - matchRegex:
          path: stringData["preflight.yaml"]
          pattern: '(?s)analyzers:\s*\[\]'

