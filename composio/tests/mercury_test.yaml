suite: test mercury deployment
templates:
  - mercury/mercury.yaml
tests:
  - it: should create mercury deployment when enabled and not using knative
    set:
      mercury.enabled: true
      mercury.useKnative: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-composio-mercury
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mercury

  - it: should not create deployment when disabled
    set:
      mercury.enabled: false
      mercury.useKnative: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create deployment when using knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not set serviceAccountName when SA is disabled
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.serviceAccount.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNull:
          path: spec.template.spec.serviceAccountName

  - it: should set serviceAccountName when SA is enabled
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.serviceAccount.enabled: true
      mercury.serviceAccount.name: mercury-sa
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: mercury-sa

  - it: should use correct replica count
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.replicaCount: 2
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should use correct image
    set:
      mercury.enabled: true
      mercury.useKnative: false
      replicated.enabled: false
      mercury.image.repository: test-mercury
      mercury.image.tag: v1.0.0
      mercury.image.pullPolicy: Always
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ".*/test-mercury:v1.0.0$"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should have correct port configuration
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.service.port: 8080
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should mount mercury secrets under /etc/secrets/mercury
    set:
      mercury.enabled: true
      mercury.useKnative: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MERCURY_SECRETS_DIR
            value: /etc/secrets/mercury
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mercury-secrets
            mountPath: /etc/secrets/mercury
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mercury-secrets
            emptyDir: {}

  - it: should keep OPENAI_API_KEY optional for deployment mode when openai integration is disabled
    set:
      mercury.enabled: true
      mercury.useKnative: false
      openAI.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: OPENAI_API_KEY
                optional: true

  - it: should render additional mercury init containers
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.additionalInitContainers:
        - name: populate-mercury-secrets
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo init >/etc/secrets/mercury/seed
          volumeMounts:
            - name: mercury-secrets
              mountPath: /etc/secrets/mercury
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: populate-mercury-secrets
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: busybox:1.36
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].name
          value: mercury-secrets
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /etc/secrets/mercury
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mercury-secrets
            emptyDir: {}

  - it: should allow overriding mercury secrets dir
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.secretsDir: /var/run/mercury-secrets
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MERCURY_SECRETS_DIR
            value: /var/run/mercury-secrets
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mercury-secrets
            mountPath: /var/run/mercury-secrets
            readOnly: true

  - it: should preserve user-defined mercury volumes and mounts
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.volumeMounts:
        - name: scratch
          mountPath: /scratch
      mercury.volumes:
        - name: scratch
          emptyDir: {}
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mercury-secrets
            mountPath: /etc/secrets/mercury
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scratch
            mountPath: /scratch
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mercury-secrets
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir: {}

  - it: should include image pull secrets when configured
    set:
      mercury.enabled: true
      mercury.useKnative: false
      replicated.enabled: false
      global.imagePullSecrets:
        - name: mercury-secret
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: mercury-secret

---
suite: test mercury service
templates:
  - mercury/mercury.yaml
tests:
  - it: should create mercury service when enabled and not using knative
    set:
      mercury.enabled: true
      mercury.useKnative: false
    documentSelector:
      path: kind
      value: Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-composio-mercury
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mercury

  - it: should have correct service configuration
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.service.type: ClusterIP
      mercury.service.port: 8080
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: should not create mercury service when using knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
    asserts:
      - hasDocuments:
          count: 0

---
suite: test mercury knative service
templates:
  - mercury/mercury-service.yaml
tests:
  - it: should create knative mercury service when enabled and using knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: apiVersion
          value: serving.knative.dev/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-composio-mercury
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mercury

  - it: should not create knative mercury service when disabled
    set:
      mercury.enabled: false
      mercury.useKnative: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create knative mercury service when not using knative
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should mount mercury secrets under /etc/secrets/mercury for knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MERCURY_SECRETS_DIR
            value: /etc/secrets/mercury
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mercury-secrets
            mountPath: /etc/secrets/mercury
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mercury-secrets
            emptyDir: {}

  - it: should keep OPENAI_API_KEY optional for knative mode when openai integration is disabled
    set:
      mercury.enabled: true
      mercury.useKnative: true
      openAI.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: OPENAI_API_KEY
                optional: true

  - it: should render additional mercury init containers for knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
      mercury.additionalInitContainers:
        - name: populate-mercury-secrets
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo init >/etc/secrets/mercury/seed
          volumeMounts:
            - name: mercury-secrets
              mountPath: /etc/secrets/mercury
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: populate-mercury-secrets
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: busybox:1.36
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].name
          value: mercury-secrets
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /etc/secrets/mercury
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mercury-secrets
            emptyDir: {}

  - it: should allow overriding mercury secrets dir for knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
      mercury.secretsDir: /var/run/mercury-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MERCURY_SECRETS_DIR
            value: /var/run/mercury-secrets
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mercury-secrets
            mountPath: /var/run/mercury-secrets
            readOnly: true

  - it: should preserve user-defined mercury volumes and mounts for knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
      mercury.volumeMounts:
        - name: scratch
          mountPath: /scratch
      mercury.volumes:
        - name: scratch
          emptyDir: {}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mercury-secrets
            mountPath: /etc/secrets/mercury
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scratch
            mountPath: /scratch
      - contains:
          path: spec.template.spec.volumes
          content:
            name: mercury-secrets
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir: {}

  - it: should include image pull secrets when configured for knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
      global.imagePullSecrets:
        - name: mercury-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: mercury-secret
