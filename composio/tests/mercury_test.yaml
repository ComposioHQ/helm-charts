suite: test mercury deployment
templates:
  - mercury/mercury.yaml
tests:
  - it: should create mercury deployment when enabled and not using knative
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-composio-mercury
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mercury

  - it: should not create deployment when disabled
    set:
      mercury.enabled: false
      mercury.useKnative: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create deployment when using knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should use correct replica count
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should use default replica count when not specified
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should use correct image
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
      replicated.enabled: false
      mercury.image.repository: test-mercury
      mercury.image.tag: v1.0.0
      mercury.image.pullPolicy: Always
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ".*/test-mercury:v1.0.0$"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should have correct port configuration
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.service.port: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should have default port when not specified
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should have security context
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: should have correct environment variables
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APOLLO_ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: COMPOSIO_ADMIN_TOKEN

  - it: should include image pull secrets when configured
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
      replicated.enabled: false
      global.imagePullSecrets:
        - name: mercury-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: mercury-secret

---
suite: test mercury service
templates:
  - mercury/mercury.yaml
tests:
  - it: should create mercury service
    documentIndex: 1
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-composio-mercury
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mercury

  - it: should have correct service configuration
    documentIndex: 1
    set:
      mercury.enabled: true
      mercury.useKnative: false
      mercury.service.type: ClusterIP
      mercury.service.port: 8080
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: 8080
