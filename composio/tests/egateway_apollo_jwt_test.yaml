suite: test Apollo trusting the eGateway's project JWTs
templates:
  - apollo/apollo-configmap.yaml
tests:
  - it: should leave Apollo's JWT settings untouched when egateway is disabled
    set:
      egateway.composioAuth.mode: jwt
      egateway.composioAuth.jwt.keyId: egw-1
    asserts:
      - notExists:
          path: data.AUTH_JWT_JWKS_URL
      - notExists:
          path: data.AUTH_JWT_ISSUER

  - it: should leave Apollo's JWT settings untouched in api_key mode
    set:
      egateway.enabled: true
    asserts:
      - notExists:
          path: data.AUTH_JWT_JWKS_URL

  - it: should verify gateway JWTs against the in-cluster JWKS Service in jwt mode
    set:
      egateway.enabled: true
      global.domain: customer.example.com
      egateway.composioAuth.mode: jwt
      egateway.composioAuth.jwt.keyId: egw-1
    asserts:
      - equal:
          path: data.AUTH_JWT_JWKS_URL
          value: http://RELEASE-NAME-composio-egateway-jwks:3002/.well-known/composio-jwks.json
      - equal:
          path: data.AUTH_JWT_ISSUER
          value: https://egateway.customer.example.com
      - equal:
          path: data.AUTH_JWT_ALLOWED_ALGS
          value: RS256
      - equal:
          path: data.SELF_HOSTED
          value: "true"

  - it: should use an explicit issuer on both sides
    set:
      egateway.enabled: true
      egateway.composioAuth.mode: jwt
      egateway.composioAuth.jwt.keyId: egw-1
      egateway.composioAuth.jwt.issuer: https://gw.acme.io
    asserts:
      - equal:
          path: data.AUTH_JWT_ISSUER
          value: https://gw.acme.io
