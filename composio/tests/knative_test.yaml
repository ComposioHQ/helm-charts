suite: test knative serving
templates:
  - mercury/mercury-service.yaml
tests:
  - it: should create knative serving when mercury uses knative
    set:
      mercury.enabled: true
      mercury.useKnative: true
      replicated.enabled: false
      mercury.image.repository: test-mercury
      mercury.image.tag: knative-test
    asserts:
      - isKind:
          of: Service
      - equal:
          path: apiVersion
          value: serving.knative.dev/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-composio-mercury
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mercury

  - it: should not create knative serving when mercury disabled
    set:
      mercury.enabled: false
      mercury.useKnative: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create knative serving when not using knative
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should have correct image configuration
    set:
      mercury.enabled: true
      mercury.useKnative: true
      replicated.enabled: false
      mercury.image.repository: test-mercury-knative
      mercury.image.tag: v2.0.0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ".*/test-mercury-knative:v2.0.0$"

  - it: should have correct scaling configuration
    set:
      mercury.enabled: true
      mercury.useKnative: true
      mercury.autoscaling.minScale: 2
      mercury.autoscaling.maxScale: 10
    asserts:
      - equal:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/minScale"]
          value: "2"
      - equal:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"]
          value: "10"

  - it: should have correct timeout and concurrency
    set:
      mercury.enabled: true
      mercury.useKnative: true
      mercury.timeoutSeconds: 600
      mercury.containerConcurrency: 10
    asserts:
      - equal:
          path: spec.template.spec.timeoutSeconds
          value: 600
      - equal:
          path: spec.template.spec.containerConcurrency
          value: 10

  - it: should have security context
    set:
      mercury.enabled: true
      mercury.useKnative: true
      mercury.securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

---
suite: test knative crds
templates:
  - knative/knative-crds.yaml
tests:
  - it: should create cluster role for knative setup
    documentIndex: 0
    set:
      mercury.useKnative: true
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: knative-setup-RELEASE-NAME

  - it: should create cluster role binding for knative setup
    documentIndex: 1
    set:
      mercury.useKnative: true
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: knative-setup-RELEASE-NAME

  - it: should create knative setup job
    documentIndex: 2
    set:
      mercury.useKnative: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: knative-setup

  - it: should use a digest-pinned kubectl image for knative setup job
    documentIndex: 2
    set:
      mercury.useKnative: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/kubectl:v1.30.14@sha256:3f2cf26d036505664c9d636d1545898f7a060f6008c21cb6982cf31fe469b0fa
      - notEqual:
          path: spec.template.spec.containers[0].image
          value: bitnami/kubectl:latest

  - it: should not create resources when knative is disabled
    set:
      mercury.useKnative: false
    asserts:
      - hasDocuments:
          count: 0

---
suite: test knative config
templates:
  - knative/knative-serving.yaml
tests:
  - it: should use a digest-pinned kubectl image for knative config job
    documentIndex: 1
    set:
      mercury.useKnative: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/kubectl:v1.30.14@sha256:3f2cf26d036505664c9d636d1545898f7a060f6008c21cb6982cf31fe469b0fa
      - notEqual:
          path: spec.template.spec.containers[0].image
          value: bitnami/kubectl:latest

  - it: should not create resources when knative is disabled
    set:
      mercury.useKnative: false
    asserts:
      - hasDocuments:
          count: 0
