---
suite: legacy service annotation compatibility
templates:
  - apollo/apollo.yaml
tests:
  - it: should add legacy GCP NEG annotation to apollo service
    documentIndex: 1
    set:
      cloud: gcp
      redis.enabled: false
      externalRedis.enabled: true
      apollo.service.type: ClusterIP
    asserts:
      - equal:
          path: metadata.annotations["cloud.google.com/neg"]
          value: '{"ingress": true}'

  - it: should add legacy Azure health probe annotation to apollo service
    documentIndex: 1
    set:
      cloud: azure
      redis.enabled: false
      externalRedis.enabled: true
      apollo.service.type: ClusterIP
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path"]
          value: /api/healthz

---
suite: legacy frontend service annotation compatibility
templates:
  - frontend/frontend.yaml
tests:
  - it: should add legacy GCP NEG annotation to frontend service
    documentIndex: 1
    set:
      cloud: gcp
      frontend.enabled: true
      frontend.service.type: ClusterIP
      frontend.image.repository: test-frontend
      frontend.image.tag: "v1.0.0"
    asserts:
      - equal:
          path: metadata.annotations["cloud.google.com/neg"]
          value: '{"ingress": true}'

---
suite: legacy Azure apollo ingress compatibility
templates:
  - apollo/apollo-ingress.yaml
tests:
  - it: should support legacy Azure ingress fields for apollo
    set:
      cloud: azure
      apollo.ingress.enabled: true
      apollo.ingress.class: nginx
      apollo.ingress.host: api.dev-adp.composio.ema.co
      apollo.ingress.tls: true
      apollo.ingress.tlsSecretName: dev-adp-apollo-tls
      apollo.ingress.path: /
      apollo.ingress.enable_ssl_server_snippet: true
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - contains:
          path: spec.tls[0].hosts
          content: api.dev-adp.composio.ema.co
      - equal:
          path: spec.tls[0].secretName
          value: dev-adp-apollo-tls
      - matchRegex:
          path: metadata.annotations["nginx.ingress.kubernetes.io/server-snippet"]
          pattern: 'ssl_server_name'
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: ImplementationSpecific

