suite: legacy GCP apollo ingress compatibility
templates:
  - apollo/apollo-ingress.yaml
tests:
  - it: should support legacy GCP ingress fields for apollo
    set:
      cloud: gcp
      apollo.ingress.enabled: true
      apollo.ingress.class: gce
      apollo.ingress.host: api.dev.composio.ema.co
      apollo.ingress.preSharedCert: composio-api-cert
      apollo.ingress.staticIPName: composio-ingress-global-ip
      apollo.ingress.path: /*
      apollo.ingress.pathType: ImplementationSpecific
    asserts:
      - equal:
          path: spec.ingressClassName
          value: gce
      - equal:
          path: metadata.annotations["ingress.gcp.kubernetes.io/pre-shared-cert"]
          value: composio-api-cert
      - equal:
          path: metadata.annotations["kubernetes.io/ingress.global-static-ip-name"]
          value: composio-ingress-global-ip
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /*
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: ImplementationSpecific

