suite: test db init jobs
templates:
  - apollo/apollo-db-init.job.yaml
tests:
  - it: should create apollo db init job when enabled
    set:
      apollo.dbInit.enabled: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: RELEASE-NAME-apollo-db-init

  - it: should not create apollo db init job when disabled
    set:
      apollo.dbInit.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should have helm hook annotations
    set:
      apollo.dbInit.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-1"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: should have ttlSecondsAfterFinished as safety net
    set:
      apollo.dbInit.enabled: true
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 86400

  - it: should not set serviceAccountName when SA is disabled
    set:
      apollo.dbInit.enabled: true
      apollo.serviceAccount.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.serviceAccountName

  - it: should set serviceAccountName when SA is enabled
    set:
      apollo.dbInit.enabled: true
      apollo.serviceAccount.enabled: true
      apollo.serviceAccount.name: apollo-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: apollo-sa

  - it: should have correct labels
    set:
      apollo.dbInit.enabled: true
    asserts:
      - equal:
          path: metadata.labels.app
          value: apollo-db-init
      - equal:
          path: metadata.labels.release
          value: RELEASE-NAME

  - it: should have correct image configuration
    set:
      apollo.dbInit.enabled: true
      apollo.dbInit.image.repository: composio-self-host/apollo-db-init
      apollo.dbInit.image.tag: v1.0.0
      apollo.dbInit.image.pullPolicy: Always
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ".*/composio-self-host/apollo-db-init:v1.0.0"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should have correct admin email environment variable
    set:
      apollo.dbInit.enabled: true
      dbInit.adminEmail: test@example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_EMAIL
            value: "test@example.com"

  - it: should have database URL from core secret
    set:
      apollo.dbInit.enabled: true
      secret.name: my-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: POSTGRES_URL
                optional: true

  - it: should have encryption key from core secret
    set:
      apollo.dbInit.enabled: true
      secret.name: my-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: ENCRYPTION_KEY
                optional: true

  - it: should mount apollo db init secrets under /etc/secrets/apollo
    set:
      apollo.dbInit.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APOLLO_SECRET_DIR
            value: /etc/secrets/apollo
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: apollo-secrets
            mountPath: /etc/secrets/apollo
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: apollo-secrets
            emptyDir: {}

  - it: should render additional apollo db init init containers
    set:
      apollo.dbInit.enabled: true
      apollo.dbInit.additionalInitContainers:
        - name: prepare-apollo-db-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo init >/etc/secrets/apollo/bootstrap
          volumeMounts:
            - name: apollo-secrets
              mountPath: /etc/secrets/apollo
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: prepare-apollo-db-init
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].name
          value: apollo-secrets
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /etc/secrets/apollo

  - it: should allow overriding apollo db init secrets dir
    set:
      apollo.dbInit.enabled: true
      apollo.secretsDir: /var/run/apollo-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APOLLO_SECRET_DIR
            value: /var/run/apollo-secrets
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: apollo-secrets
            mountPath: /var/run/apollo-secrets
            readOnly: true

  - it: should include image pull secrets when configured
    set:
      apollo.dbInit.enabled: true
      global.imagePullSecrets:
        - name: init-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: init-secret

  - it: should have correct restart policy
    set:
      apollo.dbInit.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: OnFailure

  - it: should have backoff limit and active deadline
    set:
      apollo.dbInit.enabled: true
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 3
      - equal:
          path: spec.activeDeadlineSeconds
          value: 2400

