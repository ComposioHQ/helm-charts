suite: test enterprise MCP gateway
templates:
  - egateway/egateway-configmap.yaml
  - egateway/egateway-admin.yaml
  - egateway/egateway-proxy.yaml
  - egateway/egateway-migrate-job.yaml
  - egateway/egateway-cronjobs.yaml
  - egateway/egateway-fusionauth.yaml
  - egateway/egateway-ingress.yaml
tests:
  - it: should render nothing when egateway is disabled
    set:
      egateway.enabled: false
      egateway.ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure the gateway for self-hosting with in-cluster Apollo
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
      global.domain: customer.example.com
    asserts:
      - equal:
          path: data.SENTRY_ENABLED
          value: "false"
      - equal:
          path: data.DATADOG_ENABLED
          value: "false"
      - equal:
          path: data.RESEND_ENABLED
          value: "false"
      - equal:
          path: data.COMPOSIO_BASE_URL
          value: http://RELEASE-NAME-apollo:9900
      - equal:
          path: data.AUTH_PUBLIC_URL
          value: https://egateway.customer.example.com
      - equal:
          path: data.PROXY_PUBLIC_URL
          value: https://mcp.customer.example.com
      - equal:
          path: data.FUSIONAUTH_ISSUER
          value: auth.customer.example.com
      - equal:
          path: data.FUSIONAUTH_JWKS_URL
          value: http://RELEASE-NAME-composio-egateway-fusionauth:9011/.well-known/jwks.json

  - it: should honour explicit hosts and backend URL
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
      egateway.hosts.admin: gw.acme.io
      egateway.composioBaseUrl: https://composio.acme.io
    asserts:
      - equal:
          path: data.AUTH_PUBLIC_URL
          value: https://gw.acme.io
      - equal:
          path: data.COMPOSIO_BASE_URL
          value: https://composio.acme.io

  - it: should read admin secrets from the core secret by default
    template: egateway/egateway-admin.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: EGATEWAY_POSTGRES_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CRON_SECRET
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: CRON_SECRET

  - it: should use a custom secret when secretRef is set
    template: egateway/egateway-proxy.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
      egateway.secretRef: egateway-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: egateway-secrets
                key: EGATEWAY_REDIS_URL

  - it: should run migrations as a pre-install/pre-upgrade hook
    template: egateway/egateway-migrate-job.yaml
    set:
      egateway.enabled: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["bun", "run", "--filter", "@repo/db", "db:migrate"]

  - it: should create one CronJob per scheduled admin route
    template: egateway/egateway-cronjobs.yaml
    set:
      egateway.enabled: true
    asserts:
      - hasDocuments:
          count: 12
      - isKind:
          of: CronJob

  - it: should skip CronJobs when disabled
    template: egateway/egateway-cronjobs.yaml
    set:
      egateway.enabled: true
      egateway.cronJobs.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should skip bundled FusionAuth when disabled
    template: egateway/egateway-fusionauth.yaml
    set:
      egateway.enabled: true
      egateway.fusionauth.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should point FusionAuth at its own database
    template: egateway/egateway-fusionauth.yaml
    documentIndex: 1
    set:
      egateway.enabled: true
      databaseMigration.host: pg.internal
      databaseMigration.port: "5432"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: jdbc:postgresql://pg.internal:5432/fusionauthdb

  - it: should make an RS256 key the default tenant's JWT signing key
    template: egateway/egateway-fusionauth.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
      global.domain: example.com
    asserts:
      - matchRegex:
          path: data["kickstart.json"]
          pattern: '"url": "/api/key/generate/#\{jwtSigningKeyId\}"'
      - matchRegex:
          path: data["kickstart.json"]
          pattern: '"algorithm": "RS256"'
      - matchRegex:
          path: data["kickstart.json"]
          pattern: '"accessTokenKeyId": "#\{jwtSigningKeyId\}"'
      - matchRegex:
          path: data["kickstart.json"]
          pattern: '"issuer": "auth.example.com"'
      - notMatchRegex:
          path: data["kickstart.json"]
          pattern: licenseId

  - it: should activate a FusionAuth license from the secret when enabled
    templates:
      - egateway/egateway-fusionauth.yaml
    set:
      egateway.enabled: true
      egateway.fusionauth.license.enabled: true
    asserts:
      - matchRegex:
          path: data["kickstart.json"]
          pattern: '"licenseId": "#\{ENV.FUSIONAUTH_LICENSE_ID\}"'
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FUSIONAUTH_LICENSE_ID
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: FUSIONAUTH_LICENSE_ID
        documentIndex: 1

  - it: should turn IdP-initiated SAML off for an unlicensed bundled FusionAuth
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
    asserts:
      - equal:
          path: data.FUSIONAUTH_SAML_IDP_INITIATED_ENABLED
          value: "false"

  - it: should turn IdP-initiated SAML on when the bundled FusionAuth is licensed
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
      egateway.fusionauth.license.enabled: true
    asserts:
      - equal:
          path: data.FUSIONAUTH_SAML_IDP_INITIATED_ENABLED
          value: "true"

  - it: should leave IdP-initiated SAML to the app default for an external FusionAuth
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
      egateway.fusionauth.enabled: false
    asserts:
      - notExists:
          path: data.FUSIONAUTH_SAML_IDP_INITIATED_ENABLED

  - it: should give admin the audit payload encryption secret as an optional key
    template: egateway/egateway-admin.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANALYTICS_PAYLOAD_ENCRYPTION_SECRET
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: ANALYTICS_PAYLOAD_ENCRYPTION_SECRET
                optional: true

  - it: should pin the FusionAuth image by digest and allow a mirror override
    template: egateway/egateway-fusionauth.yaml
    documentIndex: 1
    set:
      egateway.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^fusionauth/fusionauth-app:1\.67\.0@sha256:[0-9a-f]{64}$'

  - it: should use the FusionAuth imageName override
    template: egateway/egateway-fusionauth.yaml
    documentIndex: 1
    set:
      egateway.enabled: true
      egateway.fusionauth.image.imageName: registry.internal/fusionauth-app:1.67.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.internal/fusionauth-app:1.67.0

  - it: should run FusionAuth as non-root with image pull secrets
    template: egateway/egateway-fusionauth.yaml
    documentIndex: 1
    set:
      egateway.enabled: true
      replicated.enabled: false
      global.imagePullSecrets:
        - name: regcred
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: regcred
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should route admin, proxy and auth hosts through the ingress
    template: egateway/egateway-ingress.yaml
    set:
      egateway.enabled: true
      egateway.ingress.enabled: true
      global.domain: customer.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: egateway.customer.example.com
      - equal:
          path: spec.rules[1].host
          value: mcp.customer.example.com
      - equal:
          path: spec.rules[2].host
          value: auth.customer.example.com

  - it: should keep API-key auth by default without any JWT settings
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
    asserts:
      - equal:
          path: data.COMPOSIO_AUTH_MODE
          value: api_key
      - notExists:
          path: data.COMPOSIO_JWT_KEY_ID
      - notExists:
          path: data.COMPOSIO_JWT_ISSUER

  - it: should not mount a JWT signing key or JWKS Service in api_key mode
    template: egateway/egateway-admin.yaml
    set:
      egateway.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPOSIO_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: COMPOSIO_JWT_PRIVATE_KEY
        documentIndex: 0

  - it: should configure gateway-signed project JWTs in jwt mode
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
      global.domain: customer.example.com
      egateway.composioAuth.mode: jwt
      egateway.composioAuth.jwt.keyId: egw-2026-11
    asserts:
      - equal:
          path: data.COMPOSIO_AUTH_MODE
          value: jwt
      - equal:
          path: data.COMPOSIO_JWT_KEY_ID
          value: egw-2026-11
      - equal:
          path: data.COMPOSIO_JWT_ISSUER
          value: https://egateway.customer.example.com
      - equal:
          path: data.COMPOSIO_JWT_TTL_SECONDS
          value: "900"
      - notExists:
          path: data.COMPOSIO_JWT_PREVIOUS_PUBLIC_JWKS

  - it: should give admin and proxy the signing key from the secret in jwt mode
    templates:
      - egateway/egateway-admin.yaml
      - egateway/egateway-proxy.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
      egateway.composioAuth.mode: jwt
      egateway.composioAuth.jwt.keyId: egw-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPOSIO_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: COMPOSIO_JWT_PRIVATE_KEY

  - it: should serve the JWKS through a Service that includes not-ready admin pods
    template: egateway/egateway-admin.yaml
    documentIndex: 2
    set:
      egateway.enabled: true
      egateway.composioAuth.mode: jwt
      egateway.composioAuth.jwt.keyId: egw-1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-composio-egateway-jwks
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: egateway-admin

  - it: should require a key id in jwt mode
    # The ConfigMap validation surfaces through the proxy's checksum include.
    template: egateway/egateway-proxy.yaml
    set:
      egateway.enabled: true
      egateway.composioAuth.mode: jwt
    asserts:
      - failedTemplate:
          errorMessage: egateway.composioAuth.jwt.keyId is required when egateway.composioAuth.mode is jwt

  - it: should refuse jwt mode next to a separately configured Apollo JWT verifier
    template: egateway/egateway-proxy.yaml
    set:
      egateway.enabled: true
      egateway.composioAuth.mode: jwt
      egateway.composioAuth.jwt.keyId: egw-1
      apollo.auth.jwt.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: egateway.composioAuth.mode=jwt configures Apollo's JWT verifier itself; leave apollo.auth.jwt.enabled false (Apollo accepts one JWKS URL)

  - it: should reject an unknown auth mode
    template: egateway/egateway-proxy.yaml
    set:
      egateway.enabled: true
      egateway.composioAuth.mode: oauth
    asserts:
      - failedTemplate:
          errorMessage: egateway.composioAuth.mode must be api_key or jwt, got "oauth"

  - it: should give the proxy a host allow-list so it starts in production
    template: egateway/egateway-proxy.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
      global.domain: customer.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOWED_HOSTS
            value: mcp.customer.example.com,RELEASE-NAME-composio-egateway-proxy

  - it: should honour an explicit proxy host allow-list
    template: egateway/egateway-proxy.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
      egateway.proxy.allowedHosts:
        - mcp.acme.io
        - "*.acme.io"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOWED_HOSTS
            value: mcp.acme.io,*.acme.io

  - it: should run admin, proxy and migrate as the images' non-root user
    templates:
      - egateway/egateway-admin.yaml
      - egateway/egateway-proxy.yaml
      - egateway/egateway-migrate-job.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should keep admin liveness off the dependency-checking health route
    template: egateway/egateway-admin.yaml
    documentIndex: 0
    set:
      egateway.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/version
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/health

  - it: should call the bundled FusionAuth through its Service
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
      global.domain: customer.example.com
    asserts:
      - equal:
          path: data.FUSIONAUTH_INTERNAL_URL
          value: http://RELEASE-NAME-composio-egateway-fusionauth:9011
      - equal:
          path: data.FUSIONAUTH_URL
          value: https://auth.customer.example.com

  - it: should not set an internal FusionAuth URL for an external FusionAuth
    template: egateway/egateway-configmap.yaml
    set:
      egateway.enabled: true
      egateway.fusionauth.enabled: false
    asserts:
      - notExists:
          path: data.FUSIONAUTH_INTERNAL_URL

  - it: should point the proxy at the bundled FusionAuth Service
    template: egateway/egateway-proxy.yaml
    set:
      egateway.enabled: true
      global.domain: customer.example.com
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FUSIONAUTH_URL
            value: http://RELEASE-NAME-composio-egateway-fusionauth:9011
