suite: test apollo audit owner setup hook
templates:
  - apollo/apollo-audit-owner-setup.job.yaml
tests:
  - it: runs before Apollo migrations on installs and upgrades
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: RELEASE-NAME-apollo-audit-owner-setup
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-2"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: skips setup when Apollo DB init is disabled
    set:
      apollo.dbInit.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: allows disabling the one-time setup
    set:
      apollo.dbInit.auditOwnerSetup.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: reads the database URL from the core Secret by default
    set:
      secret.name: install-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: install-secret
                key: POSTGRES_URL
                optional: true

  - it: reuses Apollo DB init secret loaders for the default credentials
    set:
      apollo.secretsDir: /var/run/apollo-secrets
      apollo.dbInit.additionalInitContainers:
        - name: load-database-url
          image: secret-loader:latest
          args: ["{{ .Release.Name }}"]
          volumeMounts:
            - name: apollo-secrets
              mountPath: /var/run/apollo-secrets
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: load-database-url
      - equal:
          path: spec.template.spec.initContainers[0].args[0]
          value: RELEASE-NAME
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APOLLO_SECRET_DIR
            value: /var/run/apollo-secrets
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: apollo-secrets
            mountPath: /var/run/apollo-secrets
            readOnly: true

  - it: accepts a separate database master URL Secret
    set:
      apollo.dbInit.auditOwnerSetup.databaseUrlSecret.name: master-secret
      apollo.dbInit.auditOwnerSetup.databaseUrlSecret.key: MASTER_URL
      apollo.dbInit.auditOwnerSetup.migrationRole: apollo_admin
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: master-secret
                key: MASTER_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MIGRATION_ROLE
            value: apollo_admin

  - it: requires a migration role with a separate master URL Secret
    set:
      apollo.dbInit.auditOwnerSetup.databaseUrlSecret.name: master-secret
    asserts:
      - failedTemplate:
          errorMessage: "apollo.dbInit.auditOwnerSetup.migrationRole is required when using a separate database URL Secret"

  - it: runs the guarded SQL with psql and stops on errors
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/bin/sh", "-ec"]
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "psql.*ON_ERROR_STOP=1"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "audit_log_insert\\(text\\)"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "WITH INHERIT FALSE, SET TRUE"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "GRANT SELECT, INSERT ON TABLE public.audit_logs"

  - it: keeps dollar-quoted SQL intact after Kubernetes expands Job args
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '\$\$'
