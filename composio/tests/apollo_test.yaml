suite: test apollo deployment
templates:
  - apollo/apollo.yaml
tests:
  - it: should create apollo deployment
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-apollo
      - equal:
          path: metadata.labels.app
          value: apollo
      - equal:
          path: metadata.labels.release
          value: RELEASE-NAME

  - it: should have correct replica count
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
      apollo.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should use correct image
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
      apollo.image.repository: test-repo
      apollo.image.tag: test-tag
      apollo.image.pullPolicy: IfNotPresent
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ".*/test-repo:test-tag$"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: should have correct port configuration
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9900

  - it: should have liveness probe
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 9900
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 60

  - it: should have readiness probe
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 9900

  - it: should have rolling update strategy
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: should include image pull secrets when configured
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
      global.imagePullSecrets:
        - name: test-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: test-secret

  - it: should have correct resource limits
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
      apollo.resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "2Gi"
          cpu: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "2Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "2Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"

  - it: should configure external Redis URL in direct mode
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: false
      externalRedis.enabled: true
      externalRedis.secretRef: redis-credentials
      externalRedis.key: REDIS_URL
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-credentials
                key: REDIS_URL

  - it: should configure external Redis Sentinel envs without REDIS_URL
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: false
      externalRedis.enabled: true
      externalRedis.sentinel.enabled: true
      externalRedis.sentinel.hosts: "sentinel-a:26379,sentinel-b:26379"
      externalRedis.sentinel.masterName: ha-master
      externalRedis.sentinel.tlsEnabled: true
      externalRedis.sentinel.db: 5
      externalRedis.sentinel.secretRef: redis-sentinel-credentials
      externalRedis.sentinel.usernameKey: REDIS_USERNAME
      externalRedis.sentinel.passwordKey: REDIS_PASSWORD
      externalRedis.sentinel.sentinelPasswordKey: REDIS_SENTINEL_PASSWORD
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_HOSTS
            value: sentinel-a:26379,sentinel-b:26379
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_MASTER_NAME
            value: ha-master
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_TLS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_DB
            value: "5"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_USERNAME
            valueFrom:
              secretKeyRef:
                name: redis-sentinel-credentials
                key: REDIS_USERNAME
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-sentinel-credentials
                key: REDIS_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-sentinel-credentials
                key: REDIS_SENTINEL_PASSWORD
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
          any: true

  - it: should configure bundled Redis Sentinel envs without REDIS_URL
    documentSelector:
      path: kind
      value: Deployment
    set:
      redis.enabled: true
      externalRedis.enabled: false
      redis.architecture: replication
      redis.sentinel.enabled: true
      redis.sentinel.masterSet: ha-master
      redis.sentinel.service.ports.sentinel: 26379
      redis.auth.password: supersecret
      redis.auth.sentinel: true
      redis.tls.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_HOSTS
            value: RELEASE-NAME-redis:26379
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_MASTER_NAME
            value: ha-master
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_TLS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            value: supersecret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_PASSWORD
            value: supersecret
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
          any: true

---
suite: test apollo service
templates:
  - apollo/apollo.yaml
tests:
  - it: should create apollo service
    documentSelector:
      path: kind
      value: Service
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-apollo
      - equal:
          path: metadata.labels.app
          value: apollo

  - it: should have correct service type and port
    documentSelector:
      path: kind
      value: Service
    set:
      redis.enabled: true
      externalRedis.enabled: false
      apollo.service.type: NodePort
      apollo.service.port: 9900
      apollo.service.nodePort: 30900
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].port
          value: 9900

  - it: should have correct selector labels
    documentSelector:
      path: kind
      value: Service
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - equal:
          path: spec.selector.app
          value: apollo
      - equal:
          path: spec.selector.release
          value: RELEASE-NAME
