suite: test apollo deployment
templates:
  - apollo/apollo.yaml
tests:
  - it: should create apollo deployment
    documentSelector:
      path: kind
      value: Deployment
    set:
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-apollo
      - equal:
          path: metadata.labels.app
          value: apollo
      - equal:
          path: metadata.labels.release
          value: RELEASE-NAME

  - it: should not set serviceAccountName when SA is disabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      apollo.serviceAccount.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.serviceAccountName

  - it: should set serviceAccountName when SA is enabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      apollo.serviceAccount.enabled: true
      apollo.serviceAccount.name: apollo-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: apollo-sa

  - it: should have correct replica count
    documentSelector:
      path: kind
      value: Deployment
    set:
      apollo.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should use correct image
    documentSelector:
      path: kind
      value: Deployment
    set:
      apollo.image.repository: test-repo
      apollo.image.tag: test-tag
      apollo.image.pullPolicy: IfNotPresent
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ".*/test-repo:test-tag$"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: should have correct port configuration
    documentSelector:
      path: kind
      value: Deployment
    set:
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9900

  - it: should have liveness probe
    documentSelector:
      path: kind
      value: Deployment
    set:
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 9900
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 60

  - it: should have readiness probe
    documentSelector:
      path: kind
      value: Deployment
    set:
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 9900

  - it: should have rolling update strategy
    documentSelector:
      path: kind
      value: Deployment
    set:
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: should include image pull secrets when configured
    documentSelector:
      path: kind
      value: Deployment
    set:
      global.imagePullSecrets:
        - name: test-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: test-secret

  - it: should mount apollo secrets under /etc/secrets/apollo
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APOLLO_SECRET_DIR
            value: /etc/secrets/apollo
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: apollo-secrets
            mountPath: /etc/secrets/apollo
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: apollo-secrets
            emptyDir: {}

  - it: should expose advanced auth params beta
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXPOSE_ADVANCED_AUTH_PARAMS_BETA
            value: "true"

  - it: should keep OPENAI_API_KEY optional even when openai integration is disabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      openAI.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: composio-composio-secrets
                key: OPENAI_API_KEY
                optional: true

  - it: should render additional apollo init containers
    documentSelector:
      path: kind
      value: Deployment
    set:
      apollo.additionalInitContainers:
        - name: populate-apollo-secrets
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo init >/etc/secrets/apollo/seed
          volumeMounts:
            - name: apollo-secrets
              mountPath: /etc/secrets/apollo
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: populate-apollo-secrets
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: busybox:1.36
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].name
          value: apollo-secrets
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /etc/secrets/apollo

  - it: should allow overriding apollo secrets dir
    documentSelector:
      path: kind
      value: Deployment
    set:
      apollo.secretsDir: /var/run/apollo-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APOLLO_SECRET_DIR
            value: /var/run/apollo-secrets
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: apollo-secrets
            mountPath: /var/run/apollo-secrets
            readOnly: true

  - it: should have correct resource limits
    documentSelector:
      path: kind
      value: Deployment
    set:
      apollo.resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "2Gi"
          cpu: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "2Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "2Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"

  - it: should not configure Redis when external Redis is disabled
    documentSelector:
      path: kind
      value: Deployment
    set:
      externalRedis.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_HOSTS
          any: true

  - it: should configure external Redis URL in direct mode
    documentSelector:
      path: kind
      value: Deployment
    set:
      externalRedis.enabled: true
      externalRedis.secretRef: redis-credentials
      externalRedis.key: REDIS_URL
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-credentials
                key: REDIS_URL
                optional: true

  - it: should configure external Redis Sentinel envs without REDIS_URL
    documentSelector:
      path: kind
      value: Deployment
    set:
      externalRedis.enabled: true
      externalRedis.sentinel.enabled: true
      externalRedis.sentinel.hosts: "sentinel-a:26379,sentinel-b:26379"
      externalRedis.sentinel.masterName: ha-master
      externalRedis.sentinel.tlsEnabled: true
      externalRedis.sentinel.db: 5
      externalRedis.sentinel.secretRef: redis-sentinel-credentials
      externalRedis.sentinel.usernameKey: REDIS_USERNAME
      externalRedis.sentinel.passwordKey: REDIS_PASSWORD
      externalRedis.sentinel.sentinelPasswordKey: REDIS_SENTINEL_PASSWORD
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_HOSTS
            value: sentinel-a:26379,sentinel-b:26379
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_MASTER_NAME
            value: ha-master
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_TLS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_DB
            value: "5"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_USERNAME
            valueFrom:
              secretKeyRef:
                name: redis-sentinel-credentials
                key: REDIS_USERNAME
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-sentinel-credentials
                key: REDIS_PASSWORD
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-sentinel-credentials
                key: REDIS_SENTINEL_PASSWORD
                optional: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
          any: true

---
suite: test apollo service
templates:
  - apollo/apollo.yaml
tests:
  - it: should create apollo service
    documentSelector:
      path: kind
      value: Service
    set:
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-apollo
      - equal:
          path: metadata.labels.app
          value: apollo

  - it: should have correct service type and port
    documentSelector:
      path: kind
      value: Service
    set:
      apollo.service.type: NodePort
      apollo.service.port: 9900
      apollo.service.nodePort: 30900
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].port
          value: 9900

  - it: should have correct selector labels
    documentSelector:
      path: kind
      value: Service
    set:
    asserts:
      - equal:
          path: spec.selector.app
          value: apollo
      - equal:
          path: spec.selector.release
          value: RELEASE-NAME
