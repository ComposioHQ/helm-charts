suite: test helper functions
templates:
  - apollo/apollo.yaml
  - apollo/apollo-configmap.yaml
tests:
  - it: should generate correct name with release name
    template: apollo/apollo.yaml
    documentIndex: 0
    set:
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-apollo

  - it: should generate labels correctly
    template: apollo/apollo.yaml
    documentIndex: 0
    set:
    asserts:
      - equal:
          path: metadata.labels.app
          value: apollo
      - equal:
          path: metadata.labels.release
          value: RELEASE-NAME

---
suite: test composio.fullname helper
templates:
  - mercury/mercury.yaml
  - mercury/mercury-configmap.yaml
tests:
  - it: should use composio.fullname helper in mercury template
    template: mercury/mercury.yaml
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-composio-mercury

  - it: should use composio.labels helper in mercury template
    template: mercury/mercury.yaml
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mercury
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

---
suite: test namespace helper
templates:
  - mercury/mercury.yaml
  - mercury/mercury-configmap.yaml
tests:
  - it: should use release namespace
    template: mercury/mercury.yaml
    documentIndex: 0
    set:
      mercury.enabled: true
      mercury.useKnative: false
    asserts:
      - equal:
          path: metadata.namespace
          value: NAMESPACE
