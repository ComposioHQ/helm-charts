suite: test bundled redis-compatible cache
templates:
  - redis/service.yaml
  - redis/statefulset.yaml
  - redis/secret.yaml
tests:
  - it: should create a Valkey service with the legacy redis master name
    template: redis/service.yaml
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-redis-master
      - equal:
          path: spec.ports[0].port
          value: 6379

  - it: should create a single-node Valkey statefulset
    template: redis/statefulset.yaml
    set:
      redis.enabled: true
      externalRedis.enabled: false
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-redis-master
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/valkey/valkey:8-alpine
      - equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}

  - it: should wire explicit bundled cache password from a secret
    template: redis/statefulset.yaml
    set:
      redis.enabled: true
      externalRedis.enabled: false
      redis.auth.password: supersecret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: valkey-server
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: --requirepass
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-redis

  - it: should render password secret only when a password is configured
    template: redis/secret.yaml
    set:
      redis.enabled: true
      externalRedis.enabled: false
      redis.auth.password: supersecret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.password
          value: supersecret

  - it: should not render password secret without a password
    template: redis/secret.yaml
    set:
      redis.enabled: true
      externalRedis.enabled: false
      redis.auth.password: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: should use a volume claim when persistence is enabled
    template: redis/statefulset.yaml
    set:
      redis.enabled: true
      externalRedis.enabled: false
      redis.master.persistence.enabled: true
      redis.master.persistence.size: 12Gi
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 12Gi
