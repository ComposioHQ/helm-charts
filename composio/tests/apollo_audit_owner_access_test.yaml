suite: test apollo audit access hook
templates:
  - apollo/apollo-audit-owner-access.job.yaml
tests:
  - it: restores application access after DB init and before workloads
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: RELEASE-NAME-apollo-audit-owner-access
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "GRANT EXECUTE ON FUNCTION public.audit_log_insert\\(text\\)"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "REVOKE INSERT, UPDATE, DELETE, TRUNCATE"

  - it: skips access setup when Apollo DB init is disabled
    set:
      apollo.dbInit.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: skips access setup when audit owner setup is disabled
    set:
      apollo.dbInit.auditOwnerSetup.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the same master credentials and Apollo role as the bootstrap hook
    set:
      apollo.dbInit.auditOwnerSetup.databaseUrlSecret.name: master-secret
      apollo.dbInit.auditOwnerSetup.databaseUrlSecret.key: MASTER_URL
      apollo.dbInit.auditOwnerSetup.migrationRole: apollo_admin
      apollo.dbInit.additionalInitContainers:
        - name: load-apollo-url
          image: secret-loader:latest
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: master-secret
                key: MASTER_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MIGRATION_ROLE
            value: apollo_admin
      - notExists:
          path: spec.template.spec.initContainers
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: APOLLO_SECRET_DIR
            value: /etc/secrets/apollo
