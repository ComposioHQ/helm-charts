    tag: "r20260729_01"
    # -- Image pull policy
    pullPolicy: Always
    # -- Full image name (optional, overrides repository:tag if set)
    imageName: ""
  # -- Directory exposed to Frontend containers via FRONTEND_SECRETS_DIR.
  secretsDir: "/etc/secrets/frontend"
  # -- Additional init containers for Frontend. Mount `frontend-secrets` to populate `.Values.frontend.secretsDir`.
  additionalInitContainers: []
  # -- Additional volume mounts
  volumeMounts: []
  # -- Additional volumes
  volumes: []
  serviceAccount:
    # -- Whether the deployment should use a service account. When false, no serviceAccountName is set on the pod.
    enabled: false
    # -- Whether the chart should create the service account. Set to false if the service account already exists
    # -- (e.g. managed externally via IAM or another chart). Requires enabled: true to take effect.
    create: true
    # -- Name of the service account. Used for both creation (when create: true) and reference in the pod spec.
    name: "composio-frontend"
    # -- Annotations to add to the service account
    annotations: {}
    # -- Labels to add to the service account
    labels: {}
  # Frontend service configuration
  service:
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 3000
  # Resource requests and limits for frontend pods
  resources:
    requests:
      # -- Memory request for frontend
      memory: "2Gi"
      # -- CPU request for frontend
      cpu: "1"
    limits:
      # -- Memory limit for frontend
      memory: "3Gi"
      # -- CPU limit for frontend
      cpu: "1"
  # Frontend environment variables
  env:
    # -- Server port
    PORT: "3000"
    # -- Node environment
    NODE_ENV: "production"
    # -- Override backend URL (defaults to Apollo service URL)
    OVERRIDE_BACKEND_URL: ""
    # -- Disable social login for self-hosted deployments
    NEXT_PUBLIC_DISABLE_SOCIAL_LOGIN: "true"
    # -- Enable self-hosted mode
    NEXT_PUBLIC_SELF_HOSTED: "true"
  # Ingress configuration for frontend
  ingress:
    # -- Enable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Hostname for frontend ingress
    host: ""
    # -- TLS configuration
    tls: []
# Weaviate service configuration (vector database for search)
weaviate:
  # -- Enable Weaviate service
  enabled: true
  # -- Number of Weaviate pod replicas
  replicaCount: 1
  podDisruptionBudget:
    # -- Enable a PodDisruptionBudget for Weaviate.
    enabled: false
    # -- Maximum number of Weaviate pods that can be unavailable during voluntary disruptions. Only applied when enabled is true.
    maxUnavailable: 1
  # Weaviate container image configuration
  image:
    # -- Weaviate image repository (used when imageName is not set)
    repository: composio-self-host/weaviate
    # -- Weaviate image tag
    tag: "r20260729_01"
    # -- Image pull policy
    pullPolicy: Always
    # -- Full image name (optional, overrides repository:tag if set)
    imageName: ""
  serviceAccount:
    # -- Whether the deployment should use a service account. When false, no serviceAccountName is set on the pod.
    enabled: false
    # -- Whether the chart should create the service account. Set to false if the service account already exists
    # -- (e.g. managed externally via IAM or another chart). Requires enabled: true to take effect.
    create: true
    # -- Name of the service account. Used for both creation (when create: true) and reference in the pod spec.
    name: "composio-weaviate"
    # -- Annotations to add to the service account
    annotations: {}
    # -- Labels to add to the service account
    labels: {}
  # Weaviate service configuration
  service:
    # -- Service type
    type: ClusterIP
    # -- HTTP service port
    port: 8080
    # -- gRPC service port
    grpcPort: 50051
  # Weaviate authentication configuration
  auth:
    # -- Enable anonymous access (set to "false" for production)
    anonymousAccess: "true"
  # -- Default vectorizer module
  vectorizer: "none"
  # -- Enabled Weaviate modules
  modules: "text2vec-openai,text2vec-cohere,text2vec-huggingface,ref2vec-centroid,generative-openai,qna-openai"
  # Persistence configuration for Weaviate data
  persistence:
    # -- Enable persistent storage
    enabled: false
    # -- Size of persistent volume
    size: "10Gi"
    # -- Storage class name (empty for default)
    storageClass: ""
  # Liveness probe configuration
  livenessProbe:
    # -- Initial delay before first probe (seconds)
    initialDelaySeconds: 60
    # -- Probe interval (seconds)
    periodSeconds: 30
    # -- Probe timeout (seconds)
    timeoutSeconds: 10
    # -- Failure threshold
    failureThreshold: 3
  # Readiness probe configuration
  readinessProbe:
    # -- Initial delay before first probe (seconds)
    initialDelaySeconds: 30
    # -- Probe interval (seconds)
    periodSeconds: 10
    # -- Probe timeout (seconds)
    timeoutSeconds: 5
    # -- Failure threshold
    failureThreshold: 3
  # Resource requests and limits for Weaviate pods
  resources:
    requests:
      # -- Memory request for Weaviate
      memory: "2Gi"
      # -- CPU request for Weaviate
      cpu: "1"
    limits:
      # -- Memory limit for Weaviate
      memory: "4Gi"
      # -- CPU limit for Weaviate
      cpu: "2"
  # -- Node selector for pod placement
  # nodeSelector: {}
  # -- Tolerations for pod scheduling
  # tolerations: []
  # -- Affinity rules for pod placement
  # affinity: {}
  # -- Security context for Weaviate container
  # securityContext: {}
  # -- Additional environment variables
  # env: []

  # -- Additional volume mounts
  volumeMounts: []
  # -- Additional volumes
  volumes: []
