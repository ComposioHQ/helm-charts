# Optional search overlay; apply after values-managed-vpc.yaml.
# The release image contains these OpenAI-embedded tool and plan collections.
weaviate:
  enabled: true
  replicaCount: 1
  # A volume mounted over this path would hide the image's preloaded indexes.
  persistence:
    enabled: false
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "1", memory: 4Gi}
apollo:
  search:
    enabled: true
    vectorStoreProvider: weaviate
    embeddings:
      provider: openai
      model: text-embedding-3-large
      dimensions: 1024
    unified:
      enabled: true
      vectorStoreProvider: weaviate
      embeddings:
        provider: openai
        model: text-embedding-3-large
        dimensions: 1024
      indexTool: ToolDataOpenai
      indexPlan: UsecasePlansOpenai
    weaviate:
      collection: ToolDataOpenai
