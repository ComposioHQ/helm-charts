# Grype ignore rules for the CVE release gate (passed via --config in
# .github/scripts/cve/run-grype-scan.sh). Use this file for confirmed false
# positives only — real findings must stay visible in the report.
#
# Rules are pinned to the exact installed package version on purpose: when the
# version changes (e.g. a Python bump), the rule stops matching and the CVE
# re-surfaces for re-evaluation instead of being silently masked forever.
#
# Suppressed matches still appear in Grype's JSON output under
# `ignoredMatches` and are counted in the release report as "Suppressed".
ignore:
  # CPython tarfile/html.parser CVEs, all fixed in Python 3.14.7
  # (Misc/NEWS.d/3.14.7.rst, released 2026-08-05) — the exact version shipped
  # in the mercury image. NVD affected ranges: <3.13.15, 3.14.0–<3.14.7,
  # 3.15.0a1–<3.15.0b4. Grype mis-maps the advisory to "fixed in 3.15.0b4"
  # and flags 3.14.7 as vulnerable. Confirmed false positives 2026-08-08.
  - vulnerability: CVE-2026-11940
    package:
      name: python
      version: 3.14.7
  - vulnerability: CVE-2026-11972
    package:
      name: python
      version: 3.14.7
  - vulnerability: CVE-2026-15308
    package:
      name: python
      version: 3.14.7
