name: 'Slack Final Release Notification'
description: 'Post one final Slack message with the release verdict and build summary'

inputs:
  status:
    description: 'SUCCESS or FAILURE'
    required: true
  slack_webhook_url:
    description: 'Slack incoming webhook URL bound to the destination channel'
    required: true
  title:
    description: 'Header text for the notification'
    required: true
  summary:
    description: 'Body text with release details (supports Slack mrkdwn)'
    required: true

runs:
  using: 'composite'
  steps:
    - id: slack
      shell: bash
      env:
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
      run: |
        set -euo pipefail

        case "$INPUT_STATUS" in
          SUCCESS) COLOR="#28a745" ;;
          FAILURE) COLOR="#cb2431" ;;
          *)       COLOR="#808080" ;;
        esac

        PAYLOAD=$(jq -n \
          --arg color    "$COLOR" \
          --arg title    "$INPUT_TITLE" \
          --arg summary  "$INPUT_SUMMARY" \
          '{
            text: ($title + "\n" + $summary),
            attachments: [{
              color: $color,
              blocks: [
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("*" + $title + "*") }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: $summary }
                }
              ]
            }],
            unfurl_links: false,
            unfurl_media: false
          }')

        response="$(curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")"

        if [ "$response" != "ok" ]; then
          echo "::error::Slack webhook returned unexpected response: $response" >&2
          exit 1
        fi
