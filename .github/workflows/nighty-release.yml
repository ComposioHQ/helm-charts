name: nighty-release

on:
  schedule:
    # 00:00 IST is 18:30 UTC (previous day)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      apollo_image_tag:
        description: "ECR source tag for apollo (default latest). Resolved image is retagged to the nightly release tag."
        required: false
        type: string
        default: "latest"
      apollo_db_init_image_tag:
        description: "ECR source tag for apollo-db-init (default latest)."
        required: false
        type: string
        default: "latest"
      thermos_image_tag:
        description: "ECR source tag for thermos (default latest)."
        required: false
        type: string
        default: "latest"
      thermos_db_init_image_tag:
        description: "ECR source tag for thermos-db-init (default latest)."
        required: false
        type: string
        default: "latest"
      mercury_image_tag:
        description: "ECR source tag for mercury (default latest)."
        required: false
        type: string
        default: "latest"
      frontend_image_tag:
        description: "ECR source tag for frontend (default latest)."
        required: false
        type: string
        default: "latest"
      weaviate_image_tag:
        description: "ECR source tag for weaviate (default latest)."
        required: false
        type: string
        default: "latest"
      thermos_toolkit_registry_image_tag:
        description: "ECR source tag for thermos-toolkit-registry (default latest)."
        required: false
        type: string
        default: "latest"
      skip_cve_acknowledgement:
        description: "Leave blank. To allow release despite Grype HIGH/CRITICAL findings, type DANGEROUSLY ACKNOWLEDGE exactly. The scan still runs and reports."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 008971668139.dkr.ecr.us-east-1.amazonaws.com
  GRYPE_VERSION: v0.115.0
  OPRA_CI_DOPPLER_IDENTITY_ID: fc94b8db-1149-4b8a-8ba7-1fd4833bb870
  SLACK_IMPLEMENTATIONS_USERGROUP_ID: S092C0T771V

jobs:
  nightly-secrets:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch nightly secrets from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.OPRA_CI_DOPPLER_IDENTITY_ID }}
          doppler-project: opra-ci
          doppler-config: prd
          inject-env-vars: true

      - name: Validate required nightly secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in NIGHTLY_GITHUB_APP_CLIENT_ID NIGHTLY_GITHUB_APP_PRIVATE_KEY REPLICATED_API_TOKEN REPLICATED_APP; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Doppler secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

  retag-latest-images:
    runs-on: ubuntu-latest
    needs:
      - nightly-secrets
    outputs:
      release_tag: ${{ steps.retag.outputs.release_tag }}
      retagged_images: ${{ steps.retag.outputs.retagged_images }}
    env:
      IMAGE_REPOS: "apollo frontend apollo-db-init thermos thermos-db-init mercury weaviate thermos-toolkit-registry"
      # Per-repo ECR source tags (manual runs only; empty on schedule). Empty = use "latest".
      SOURCE_TAG_APOLLO: ${{ github.event.inputs.apollo_image_tag || '' }}
      SOURCE_TAG_APOLLO_DB_INIT: ${{ github.event.inputs.apollo_db_init_image_tag || '' }}
      SOURCE_TAG_THERMOS: ${{ github.event.inputs.thermos_image_tag || '' }}
      SOURCE_TAG_THERMOS_DB_INIT: ${{ github.event.inputs.thermos_db_init_image_tag || '' }}
      SOURCE_TAG_MERCURY: ${{ github.event.inputs.mercury_image_tag || '' }}
      SOURCE_TAG_FRONTEND: ${{ github.event.inputs.frontend_image_tag || '' }}
      SOURCE_TAG_WEAVIATE: ${{ github.event.inputs.weaviate_image_tag || '' }}
      SOURCE_TAG_THERMOS_TOOLKIT_REGISTRY: ${{ github.event.inputs.thermos_toolkit_registry_image_tag || '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Calculate release tag from latest GitHub release
        id: calculate_release_tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          date_ist="$(TZ=Asia/Kolkata date +%Y%m%d)"
          api_root="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          releases_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_root}/releases?per_page=20")"

          latest_release="$(echo "${releases_json}" | jq -c '[.[] | select(.draft == false)] | sort_by(.published_at // .created_at) | last // empty')"

          base_tag=""
          source_release_tag=""
          source_release_id=""
          source_manifest_tag=""

          if [[ -n "${latest_release}" ]]; then
            source_release_tag="$(echo "${latest_release}" | jq -r '.tag_name // empty')"
            source_release_id="$(echo "${latest_release}" | jq -r '.id // empty')"

            manifest_asset_url="$(echo "${latest_release}" | jq -r '.assets[]? | select(.name=="release-manifest.json") | .url' | head -n1)"
            if [[ -n "${manifest_asset_url}" ]]; then
              manifest_json="$(curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/octet-stream" \
                "${manifest_asset_url}")"
              source_manifest_tag="$(echo "${manifest_json}" | jq -r '.release_tag // empty')"
            fi

            if [[ "${source_manifest_tag}" =~ ^r[0-9]{8}_[0-9]{2}$ ]]; then
              base_tag="${source_manifest_tag}"
            elif [[ "${source_release_tag}" =~ ^r[0-9]{8}_[0-9]{2}$ ]]; then
              base_tag="${source_release_tag}"
            fi
          fi

          if [[ "${base_tag}" =~ ^r([0-9]{8})_([0-9]{2})$ ]]; then
            current_date="${BASH_REMATCH[1]}"
            current_nn="${BASH_REMATCH[2]}"

            if [[ "${current_date}" == "${date_ist}" ]]; then
              next_nn="$(printf '%02d' "$((10#${current_nn} + 1))")"
            else
              next_nn="01"
            fi
          else
            next_nn="01"
          fi

          new_tag="r${date_ist}_${next_nn}"
          echo "Latest release id: ${source_release_id:-none}"
          echo "Latest release tag: ${source_release_tag:-none}"
          echo "Source manifest tag: ${source_manifest_tag:-none}"
          echo "Base tag used for increment: ${base_tag:-none}"
          echo "Calculated release tag: ${new_tag}"

          {
            echo "source_release_id=${source_release_id}"
            echo "source_release_tag=${source_release_tag}"
            echo "source_manifest_tag=${source_manifest_tag}"
            echo "base_tag=${base_tag}"
            echo "release_tag=${new_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Determine AWS Assume Role ARN
        id: env
        run: |
            echo "AWS_ROLE_ARN=arn:aws:iam::008971668139:role/github-actions-helm-charts-ecr" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ steps.env.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve latest digest and retag
        id: retag
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION:-}" ]]; then
            echo "AWS_REGION is required."
            exit 1
          fi

          NEW_TAG="${{ steps.calculate_release_tag.outputs.release_tag }}"
          echo "Using release tag from latest GitHub release calculation: ${NEW_TAG}"

          resolve_source_tag() {
            local r="$1"
            local v=""
            case "${r}" in
              apollo) v="${SOURCE_TAG_APOLLO:-}" ;;
              apollo-db-init) v="${SOURCE_TAG_APOLLO_DB_INIT:-}" ;;
              thermos) v="${SOURCE_TAG_THERMOS:-}" ;;
              thermos-db-init) v="${SOURCE_TAG_THERMOS_DB_INIT:-}" ;;
              mercury) v="${SOURCE_TAG_MERCURY:-}" ;;
              frontend) v="${SOURCE_TAG_FRONTEND:-}" ;;
              weaviate) v="${SOURCE_TAG_WEAVIATE:-}" ;;
              thermos-toolkit-registry) v="${SOURCE_TAG_THERMOS_TOOLKIT_REGISTRY:-}" ;;
              *) v="" ;;
            esac
            if [[ -n "${v}" ]]; then
              printf '%s' "${v}"
            else
              printf '%s' "latest"
            fi
          }

          results='[]'

          for repo in ${IMAGE_REPOS}; do
            SOURCE_TAG="$(resolve_source_tag "${repo}")"
            echo "Resolving composio-self-host/${repo} from tag: ${SOURCE_TAG} → will publish tag: ${NEW_TAG}"

            image_json="$(aws ecr batch-get-image \
              --repository-name composio-self-host/"${repo}" \
              --image-ids imageTag="${SOURCE_TAG}" \
              --accepted-media-types \
                application/vnd.oci.image.manifest.v1+json \
                application/vnd.oci.image.index.v1+json \
                application/vnd.docker.distribution.manifest.v2+json \
                application/vnd.docker.distribution.manifest.list.v2+json \
              --output json)"

            digest="$(echo "${image_json}" | jq -r '.images[0].imageId.imageDigest // empty')"
            manifest="$(echo "${image_json}" | jq -r '.images[0].imageManifest // empty')"
            media_type="$(echo "${image_json}" | jq -r '.images[0].imageManifestMediaType // empty')"

            if [[ -z "${digest}" || -z "${manifest}" ]]; then
              echo "Failed to resolve latest image for repo: ${repo}"
              exit 1
            fi

            metadata_json="$(aws ecr describe-images \
              --repository-name composio-self-host/"${repo}" \
              --image-ids imageDigest="${digest}" \
              --output json)"

            pushed_at="$(echo "${metadata_json}" | jq -r '.imageDetails[0].imagePushedAt // empty')"
            size_bytes="$(echo "${metadata_json}" | jq -r '.imageDetails[0].imageSizeInBytes // empty')"

            existing_tag_json=""
            existing_tag_error="$(mktemp)"
            set +e
            existing_tag_json="$(aws ecr describe-images \
              --repository-name composio-self-host/"${repo}" \
              --image-ids imageTag="${NEW_TAG}" \
              --output json 2>"${existing_tag_error}")"
            existing_tag_rc=$?
            set -e

            if (( existing_tag_rc == 0 )); then
              existing_digest="$(echo "${existing_tag_json}" | jq -r '.imageDetails[0].imageDigest // empty')"
              if [[ "${existing_digest}" == "${digest}" ]]; then
                echo "Tag ${NEW_TAG} already exists for ${repo} with the expected digest; leaving it in place."
              else
                echo "Tag ${NEW_TAG} already exists for ${repo} with digest ${existing_digest}, expected ${digest}" >&2
                exit 1
              fi
            elif grep -q 'ImageNotFoundException' "${existing_tag_error}"; then
              if [[ -n "${media_type}" ]]; then
                aws ecr put-image \
                  --repository-name composio-self-host/"${repo}" \
                  --image-tag "${NEW_TAG}" \
                  --image-manifest-media-type "${media_type}" \
                  --image-manifest "${manifest}" \
                  >/dev/null
              else
                aws ecr put-image \
                  --repository-name composio-self-host/"${repo}" \
                  --image-tag "${NEW_TAG}" \
                  --image-manifest "${manifest}" \
                  >/dev/null
              fi
            else
              cat "${existing_tag_error}" >&2
              exit "${existing_tag_rc}"
            fi
            rm -f "${existing_tag_error}"

            echo "repo=${repo} latest_digest=${digest} new_tag=${NEW_TAG} pushed_at=${pushed_at} size_bytes=${size_bytes}"

            row="$(jq -n \
              --arg repo composio-self-host/"${repo}" \
              --arg latest_digest "${digest}" \
              --arg new_tag "${NEW_TAG}" \
              --arg pushed_at "${pushed_at}" \
              --arg size_bytes "${size_bytes}" \
              '{repo: $repo, latest_digest: $latest_digest, new_tag: $new_tag, pushed_at: $pushed_at, size_bytes: $size_bytes}')"
            results="$(echo "${results}" | jq -c --argjson row "${row}" '. + [$row]')"
          done

          {
            echo "release_tag=${NEW_TAG}"
            echo "retagged_images<<EOF"
            echo "${results}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Print outputs
        run: |
          echo "release_tag: ${{ steps.retag.outputs.release_tag }}"
          echo "retagged_images: ${{ steps.retag.outputs.retagged_images }}"

  cve-scan:
    runs-on: ubuntu-latest
    needs:
      - retag-latest-images
    permissions:
      id-token: write
      contents: read
    outputs:
      scan_result: ${{ steps.scan.outputs.scan_result }}
      summary: ${{ steps.scan.outputs.summary }}
      stats: ${{ steps.scan.outputs.stats }}
      artifact_name: ${{ steps.scan.outputs.artifact_name }}
      artifact_download_command: ${{ steps.scan.outputs.artifact_download_command }}
    steps:
      - name: Reject invalid CVE override acknowledgement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_cve_acknowledgement != '' && inputs.skip_cve_acknowledgement != 'DANGEROUSLY ACKNOWLEDGE' }}
        shell: bash
        run: |
          echo "The CVE gate can only be skipped by typing DANGEROUSLY ACKNOWLEDGE exactly." >&2
          exit 1

      - name: Determine AWS Assume Role ARN
        id: env
        shell: bash
        run: |
          echo "AWS_ROLE_ARN=arn:aws:iam::008971668139:role/github-actions-helm-charts-ecr" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ steps.env.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR for Grype registry scans
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Install Grype
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://get.anchore.io/grype -o /tmp/install-grype.sh
          sudo sh /tmp/install-grype.sh -b /usr/local/bin "${GRYPE_VERSION}"
          grype version

      - name: Scan retagged images with Grype
        id: scan
        shell: bash
        env:
          RETAGGED_IMAGES_JSON: ${{ needs.retag-latest-images.outputs.retagged_images }}
          RELEASE_TAG: ${{ needs.retag-latest-images.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p cve-reports
          summary_file="cve-reports/summary.md"
          stats_tsv_file="cve-reports/image-stats.tsv"
          stats_json_file="cve-reports/image-stats.json"
          slack_stats_file="cve-reports/slack-stats.md"
          artifact_name="nightly-grype-cve-reports-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_download_command="gh run download ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --name ${artifact_name} --dir ./nightly-grype-reports"

          printf 'repo\timage\thigh\tcritical\tgrype_exit\treport\n' > "${stats_tsv_file}"
          echo '[]' > "${stats_json_file}"
          : > "${slack_stats_file}"

          {
            echo "## Grype CVE Scan"
            echo
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Policy: fail on any HIGH or CRITICAL finding"
            echo "- Artifact: \`${artifact_name}\`"
            echo
            echo "Download full reports:"
            echo
            echo "\`\`\`bash"
            echo "${artifact_download_command}"
            echo "\`\`\`"
            echo
          } > "${summary_file}"

          if [[ -z "${RETAGGED_IMAGES_JSON}" || "${RETAGGED_IMAGES_JSON}" == "[]" ]]; then
            echo "No retagged images were provided to the CVE scan." >> "${summary_file}"
            echo "No image-level Grype stats were produced." > "${slack_stats_file}"
            {
              echo "scan_result=failed"
              echo "artifact_name=${artifact_name}"
              echo "artifact_download_command=${artifact_download_command}"
              echo "stats<<__CVE_STATS__"
              cat "${slack_stats_file}"
              echo "__CVE_STATS__"
              echo "summary<<__CVE_SUMMARY__"
              cat "${summary_file}"
              echo "__CVE_SUMMARY__"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          scan_result="success"
          total_high=0
          total_critical=0
          scan_error_summary=""
          mapfile -t image_rows < <(jq -c '.[]' <<<"${RETAGGED_IMAGES_JSON}")

          {
            echo "### Image findings"
            echo
            echo "| Image | HIGH | CRITICAL | Grype exit | Report |"
            echo "| --- | ---: | ---: | ---: | --- |"
          } >> "${summary_file}"

          for row in "${image_rows[@]}"; do
            repo="$(jq -r '.repo' <<<"${row}")"
            tag="$(jq -r '.new_tag' <<<"${row}")"
            image="${ECR_REGISTRY}/${repo}:${tag}"
            safe_name="${repo//\//_}"
            report_json="cve-reports/${safe_name}.json"

            echo "Scanning ${image}"
            set +e
            grype "registry:${image}" \
              --fail-on high \
              --output json \
              --file "${report_json}"
            grype_rc=$?
            set -e

            high_count="0"
            critical_count="0"
            if [[ -s "${report_json}" ]]; then
              high_count="$(
                jq '[.matches[]? | select(((.vulnerability.severity // "") | ascii_downcase) == "high")] | length' "${report_json}"
              )"
              critical_count="$(
                jq '[.matches[]? | select(((.vulnerability.severity // "") | ascii_downcase) == "critical")] | length' "${report_json}"
              )"
            fi

            total_high="$((total_high + high_count))"
            total_critical="$((total_critical + critical_count))"
            report_name="${safe_name}.json"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "${repo}" "${image}" "${high_count}" "${critical_count}" "${grype_rc}" "${report_name}" >> "${stats_tsv_file}"
            stats_row="$(jq -n \
              --arg repo "${repo}" \
              --arg image "${image}" \
              --arg report "${report_name}" \
              --argjson high "${high_count}" \
              --argjson critical "${critical_count}" \
              --argjson grype_exit "${grype_rc}" \
              '{repo: $repo, image: $image, high: $high, critical: $critical, grype_exit: $grype_exit, report: $report}')"
            jq -c --argjson row "${stats_row}" '. + [$row]' "${stats_json_file}" > "${stats_json_file}.tmp"
            mv "${stats_json_file}.tmp" "${stats_json_file}"

            {
              echo "| \`${repo}\` | ${high_count} | ${critical_count} | ${grype_rc} | \`${report_name}\` |"
            } >> "${summary_file}"

            if (( grype_rc == 2 || high_count > 0 || critical_count > 0 )); then
              scan_result="failed"
            fi

            if (( grype_rc != 0 && grype_rc != 2 && high_count == 0 && critical_count == 0 )); then
              scan_result="failed"
              if [[ -z "${scan_error_summary}" ]]; then
                scan_error_summary="Grype failed while scanning ${repo} with exit code ${grype_rc}"
              fi
            fi
          done

          jq -r '.[] | "- `" + .repo + "`: " + (.high | tostring) + " HIGH / " + (.critical | tostring) + " CRITICAL"' "${stats_json_file}" > "${slack_stats_file}"

          {
            echo
            echo "### Totals"
            echo
            echo "- HIGH: ${total_high}"
            echo "- CRITICAL: ${total_critical}"
          } >> "${summary_file}"

          if (( total_high > 0 || total_critical > 0 )); then
            {
              echo "### Failure"
              echo
              echo "Grype found ${total_high} HIGH and ${total_critical} CRITICAL findings across scanned images."
            } >> "${summary_file}"
          elif [[ -n "${scan_error_summary}" ]]; then
            {
              echo "### Failure"
              echo
              echo "${scan_error_summary}"
            } >> "${summary_file}"
          fi

          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"

          {
            echo "scan_result=${scan_result}"
            echo "artifact_name=${artifact_name}"
            echo "artifact_download_command=${artifact_download_command}"
            echo "stats<<__CVE_STATS__"
            cat "${slack_stats_file}"
            echo "__CVE_STATS__"
            echo "summary<<__CVE_SUMMARY__"
            cat "${summary_file}"
            echo "__CVE_SUMMARY__"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload Grype reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.scan.outputs.artifact_name || format('nightly-grype-cve-reports-{0}-{1}-{2}', needs.retag-latest-images.outputs.release_tag, github.run_id, github.run_attempt) }}
          if-no-files-found: warn
          path: cve-reports

      - name: Fail on HIGH or CRITICAL CVEs
        if: ${{ steps.scan.outputs.scan_result != 'success' && !(github.event_name == 'workflow_dispatch' && inputs.skip_cve_acknowledgement == 'DANGEROUSLY ACKNOWLEDGE') }}
        shell: bash
        run: |
          echo "Grype reported HIGH or CRITICAL vulnerabilities. Blocking nightly release." >&2
          exit 1

  replicated-release:
    runs-on: ubuntu-latest
    if: ${{ needs.retag-latest-images.result == 'success' && needs.cve-scan.result == 'success' }}
    needs:
      - retag-latest-images
      - cve-scan
    permissions:
      contents: write
      id-token: write
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
      previous_version: ${{ steps.version.outputs.current }}
      version: ${{ steps.version.outputs.new }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: release-stable

      - name: Set branch name
        id: branch
        run: |
          echo "branch_name=nightly-${{ needs.retag-latest-images.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Create nightly branch
        run: |
          git checkout -B "${{ steps.branch.outputs.branch_name }}"

      - name: Install yq
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d

      - name: Install Replicated CLI
        run: |
          version=$(curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest \
            | grep -m1 -Po '"tag_name":\s*"v\K[^"]+')
          echo "Downloading Replicated CLI..."
          curl -Ls \
            "https://github.com/replicatedhq/replicated/releases/download/v${version}/replicated_${version}_linux_amd64.tar.gz" \
            -o replicated.tar.gz
          echo "Extracting Replciated CLI..."
          tar xf replicated.tar.gz replicated && rm replicated.tar.gz
          echo "Installing Replicated CLI in /usr/local/bin/"
          sudo install replicated /usr/local/bin/replicated

      - name: Fetch replicated release secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.OPRA_CI_DOPPLER_IDENTITY_ID }}
          doppler-project: opra-ci
          doppler-config: prd
          inject-env-vars: true

      - name: Check replicated
        run: |
          set -euo pipefail
          replicated app ls &> /dev/null || exit 1

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: 'latest'

      - name: Run Helm template
        run: |
          helm template composio ./composio

      - name: Get and bump version
        id: version
        run: |
          set -euo pipefail
          app_id="$(
            curl -fsSL "https://api.replicated.com/vendor/v3/apps" \
              --header "Accept: application/json" \
              --header "Authorization: ${REPLICATED_API_TOKEN}" \
              | jq -r --arg app "${REPLICATED_APP}" '
                  .apps[]
                  | select(.id == $app or .slug == $app or .name == $app)
                  | .id
                ' \
              | head -n1
          )"

          if [[ -z "${app_id}" || "${app_id}" == "null" ]]; then
            echo "Unable to resolve Replicated app ID for ${REPLICATED_APP}" >&2
            exit 1
          fi

          channels_json="$(
            curl -fsSLG "https://api.replicated.com/vendor/v3/app/${app_id}/channels" \
              --data-urlencode "channelName=Nightly" \
              --header "Accept: application/json" \
              --header "Authorization: ${REPLICATED_API_TOKEN}"
          )"

          if [[ "$(echo "${channels_json}" | jq -r '.totalCount')" != "1" ]]; then
            echo "Nightly channel was not found in Replicated channels API response" >&2
            exit 1
          fi

          CURRENT_APPVERSION="$(
            echo "${channels_json}" | jq -r '.channels[0].currentVersion // empty'
          )"

          if [[ -z "${CURRENT_APPVERSION}" || "${CURRENT_APPVERSION}" == "null" ]]; then
            echo "Nightly channel response did not include currentVersion" >&2
            exit 1
          fi

          NEW_APPVERSION="$(echo "${CURRENT_APPVERSION}" | awk -F. '{$NF = $NF + 1} 1' OFS=.)"
          echo "current=${CURRENT_APPVERSION}" >> "${GITHUB_OUTPUT}"
          echo "new=${NEW_APPVERSION}" >> "${GITHUB_OUTPUT}"
          echo "Current version: ${CURRENT_APPVERSION}"
          echo "New version: ${NEW_APPVERSION}"

      - name: Update Chart.yaml versions
        run: |
          cd ./composio
          export NEW_VERSION="${{ steps.version.outputs.new }}"
          yq eval -i '.appVersion = strenv(NEW_VERSION)' ./Chart.yaml
          yq eval -i '.version = strenv(NEW_VERSION)' ./Chart.yaml
          echo "Updated Chart.yaml"

      - name: Update manifest versions
        run: |
          export NEW_VERSION="${{ steps.version.outputs.new }}"
          export RELEASE_TAG="${{ needs.retag-latest-images.outputs.release_tag }}"

          cd ./composio
          yq eval -i '.apollo.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          yq eval -i '.apollo.dbInit.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          yq eval -i '.thermos.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          yq eval -i '.thermos.dbInit.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          yq eval -i '.thermosMiscWorkers.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          yq eval -i '.mercury.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          yq eval -i '.frontend.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          yq eval -i '.weaviate.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          yq eval -i '.toolkitRegistry.image.tag = strenv(RELEASE_TAG)' ./values.yaml
          cd -

          cd ./manifests
          yq eval -i '.metadata.labels."app.kubernetes.io/version" = strenv(NEW_VERSION)' ./k8s-app.yaml
          yq eval -i '.spec.descriptor.version = strenv(NEW_VERSION)' ./k8s-app.yaml
          yq eval -i '.spec.chart.chartVersion = strenv(NEW_VERSION)' ./composio.yaml
          echo "Updated manifest files and composio values"

      - name: Commit nightly release updates
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add composio/Chart.yaml composio/values.yaml manifests/k8s-app.yaml manifests/composio.yaml
          git commit --signoff -m "chore: nightly release ${{ steps.branch.outputs.branch_name }}"

      - name: Clean old packages
        run: |
          echo "Removing old tgz files"
          rm -f ./manifests/*.tgz

      - name: Package and create Replicated release
        run: |
          set -euo pipefail
          echo "Packaging Helm chart..."
          helm package ./composio --destination manifests
          echo "Creating Replicated release..."
          replicated release create \
          --yaml-dir manifests \
          --promote "Nightly" \
          --version "${{ steps.version.outputs.new }}"

      - name: Push nightly branch
        if: success()
        run: |
          set -euo pipefail
          git push --force-with-lease origin "${{ steps.branch.outputs.branch_name }}"

  create-nightly-release-pr:
    if: ${{ needs.replicated-release.result == 'success' && needs.cve-scan.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - cve-scan
      - retag-latest-images
      - replicated-release
    permissions:
      id-token: write
      contents: read
    outputs:
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      release_url: ${{ steps.github_release.outputs.release_url }}
    steps:
      - name: Pull latest nightly branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.replicated-release.outputs.branch_name }}

      - name: Record nightly branch HEAD
        id: nightly_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch nightly secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.OPRA_CI_DOPPLER_IDENTITY_ID }}
          doppler-project: opra-ci
          doppler-config: prd
          inject-env-vars: true

      - name: Mint GitHub App token
        id: app_token
        shell: bash
        env:
          GITHUB_APP_OWNER: ${{ github.repository_owner }}
          GITHUB_APP_REPOSITORIES: helm-charts,onprem-testbed
          GITHUB_APP_PERMISSIONS_JSON: '{"actions":"write","contents":"write","issues":"write","pull_requests":"write"}'
        run: |
          set -euo pipefail
          export GITHUB_APP_CLIENT_ID="${NIGHTLY_GITHUB_APP_CLIENT_ID}"
          export GITHUB_APP_PRIVATE_KEY="${NIGHTLY_GITHUB_APP_PRIVATE_KEY}"
          token_json="$(node .github/scripts/github-app-token.mjs)"
          token="$(jq -r '.token' <<<"${token_json}")"
          expires_at="$(jq -r '.expires_at' <<<"${token_json}")"
          if [[ -z "${token}" || "${token}" == "null" ]]; then
            echo "Unable to mint GitHub App token" >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
          echo "expires_at=${expires_at}" >> "${GITHUB_OUTPUT}"

      - name: Create nightly release PR
        id: create_pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.payload.repository.default_branch;
            const head = "${{ needs.replicated-release.outputs.branch_name }}";
            const releaseTag = "${{ needs.retag-latest-images.outputs.release_tag }}";
            const version = "${{ needs.replicated-release.outputs.version }}";
            const cveScanResult = "${{ needs.cve-scan.outputs.scan_result }}";
            const cveOverrideAcknowledged = "${{ github.event_name == 'workflow_dispatch' && inputs.skip_cve_acknowledgement == 'DANGEROUSLY ACKNOWLEDGE' && 'true' || 'false' }}" === "true";
            const cveLine = cveOverrideAcknowledged
              ? `Grype CVE scan result was \`${cveScanResult}\`; release was manually allowed with \`DANGEROUSLY ACKNOWLEDGE\``
              : "Grype CVE gate passed before release creation";
            const title = `Nightly release ${releaseTag}`;
            const body = `## Summary

            - Bump Helm chart version to ${version}
            - Update nightly image tags to ${releaseTag}
            - Refresh replicated manifest versions
            - ${cveLine}
            - Nightly workflow dispatches onprem-testbed fresh-install and upgrade validation`;

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
            });

            let pr;
            if (pulls.length > 0) {
              pr = pulls[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
            } else {
              const response = await github.rest.pulls.create({
                owner,
                repo,
                base,
                head,
                title,
                body,
              });
              pr = response.data;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: ["nightly-release"],
            });

            core.setOutput("pr_url", pr.html_url);
            core.setOutput("pr_number", String(pr.number));

      - name: Ensure GitHub nightly release exists
        id: github_release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag_name = "${{ needs.retag-latest-images.outputs.release_tag }}";
            const target_commitish = "${{ steps.nightly_head.outputs.sha }}";
            const version = "${{ needs.replicated-release.outputs.version }}";
            const prUrl = "${{ steps.create_pr.outputs.pr_url }}";
            const body = [
              `Nightly image tag **\`${tag_name}\`** (Helm / Replicated appVersion **${version}**).`,
              "",
              prUrl ? `Tracking PR: ${prUrl}` : "",
            ]
              .filter(Boolean)
              .join("\n");

            try {
              const { data: existingRelease } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: tag_name,
              });

              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existingRelease.id,
                tag_name,
                target_commitish,
                name: version,
                body,
                draft: existingRelease.draft,
                prerelease: true,
              });
              core.info(`Updated GitHub release for tag ${tag_name}.`);
              core.setOutput("release_url", existingRelease.html_url);
            } catch (e) {
              const status = e.status ?? e.response?.status;
              if (status !== 404) {
                throw e;
              }

              const { data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name,
                target_commitish,
                name: version,
                body,
                draft: false,
                prerelease: true,
              });
              core.info(`Created GitHub release ${tag_name} at ${target_commitish}`);
              core.setOutput("release_url", release.html_url);
            }

  onprem-testbed:
    if: ${{ needs.replicated-release.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - replicated-release
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 720
    steps:
      - name: Checkout harness dispatch scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          sparse-checkout: |
            .github/scripts/run-onprem-test-harness.sh
            .github/scripts/github-app-token.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Fetch nightly secrets from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.OPRA_CI_DOPPLER_IDENTITY_ID }}
          doppler-project: opra-ci
          doppler-config: prd
          inject-env-vars: true

      - name: Run onprem-testbed fresh-install harness
        id: fresh
        continue-on-error: true
        shell: bash
        env:
          HARNESS_NAME: Nightly onprem-testbed fresh install
          HELM_CHART_VERSION: ${{ needs.replicated-release.outputs.version }}
          MIGRATION_DIRECTION: upgrade
          CLUSTER_SIZE: xlarge
          INCLUDE_OPTIONAL_SCENARIOS: "false"
          HARNESS_ENV_JSON: '{"RUN_TRIGGER_TESTS":"1","RUN_POLLING_TRIGGER_TESTS":"1","RUN_WEBHOOK_TRIGGER_TESTS":"1"}'
          ONPREM_REF: main
        run: |
          export GITHUB_APP_CLIENT_ID="${NIGHTLY_GITHUB_APP_CLIENT_ID}"
          export GITHUB_APP_PRIVATE_KEY="${NIGHTLY_GITHUB_APP_PRIVATE_KEY}"
          bash .github/scripts/run-onprem-test-harness.sh

      - name: Run onprem-testbed upgrade harness
        id: upgrade
        continue-on-error: true
        shell: bash
        env:
          HARNESS_NAME: Nightly onprem-testbed upgrade
          HELM_CHART_VERSION: ${{ needs.replicated-release.outputs.version }}
          UPGRADE_FROM_VERSIONS: ${{ needs.replicated-release.outputs.previous_version }}
          MIGRATION_DIRECTION: upgrade
          CLUSTER_SIZE: xlarge
          INCLUDE_OPTIONAL_SCENARIOS: "false"
          HARNESS_ENV_JSON: '{"RUN_TRIGGER_TESTS":"1","RUN_POLLING_TRIGGER_TESTS":"1","RUN_WEBHOOK_TRIGGER_TESTS":"1"}'
          ONPREM_REF: main
        run: |
          export GITHUB_APP_CLIENT_ID="${NIGHTLY_GITHUB_APP_CLIENT_ID}"
          export GITHUB_APP_PRIVATE_KEY="${NIGHTLY_GITHUB_APP_PRIVATE_KEY}"
          bash .github/scripts/run-onprem-test-harness.sh

      - name: Fail if any onprem-testbed harness failed
        if: ${{ steps.fresh.outcome != 'success' || steps.upgrade.outcome != 'success' }}
        shell: bash
        run: |
          echo "Fresh-install harness outcome: ${{ steps.fresh.outcome }}" >&2
          echo "Upgrade harness outcome: ${{ steps.upgrade.outcome }}" >&2
          exit 1

  notify-nightly-report:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - nightly-secrets
      - retag-latest-images
      - cve-scan
      - replicated-release
      - create-nightly-release-pr
      - onprem-testbed
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Slack action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          sparse-checkout: |
            .github/actions/slack-notify
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Fetch nightly secrets from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.OPRA_CI_DOPPLER_IDENTITY_ID }}
          doppler-project: opra-ci
          doppler-config: prd
          inject-env-vars: true

      - name: Validate Slack webhook URL
        shell: bash
        env:
          NIGHTLY_SLACK_WEBHOOK_URL: ${{ steps.doppler.outputs.NIGHTLY_SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${NIGHTLY_SLACK_WEBHOOK_URL:-}" ]]; then
            echo "Missing required Doppler secret: NIGHTLY_SLACK_WEBHOOK_URL" >&2
            exit 1
          fi

      - name: Build Slack summary
        id: summary
        shell: bash
        env:
          NIGHTLY_SECRETS_RESULT: ${{ needs.nightly-secrets.result }}
          RETAG_RESULT: ${{ needs.retag-latest-images.result }}
          CVE_RESULT: ${{ needs.cve-scan.result }}
          CVE_SCAN_RESULT: ${{ needs.cve-scan.outputs.scan_result }}
          REPLICATED_RESULT: ${{ needs.replicated-release.result }}
          PR_RESULT: ${{ needs.create-nightly-release-pr.result }}
          ONPREM_RESULT: ${{ needs.onprem-testbed.result }}
          RELEASE_TAG: ${{ needs.retag-latest-images.outputs.release_tag }}
          RELEASE_BRANCH: ${{ needs.replicated-release.outputs.branch_name }}
          PREVIOUS_VERSION: ${{ needs.replicated-release.outputs.previous_version }}
          NEW_VERSION: ${{ needs.replicated-release.outputs.version }}
          PR_URL: ${{ needs.create-nightly-release-pr.outputs.pr_url }}
          RELEASE_URL: ${{ needs.create-nightly-release-pr.outputs.release_url }}
          CVE_STATS: ${{ needs.cve-scan.outputs.stats }}
          CVE_ARTIFACT_NAME: ${{ needs.cve-scan.outputs.artifact_name }}
          CVE_ARTIFACT_DOWNLOAD_COMMAND: ${{ needs.cve-scan.outputs.artifact_download_command }}
          CVE_OVERRIDE_ACKNOWLEDGED: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_cve_acknowledgement == 'DANGEROUSLY ACKNOWLEDGE' && '1' || '0' }}
          CVE_OVERRIDE_INVALID: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_cve_acknowledgement != '' && inputs.skip_cve_acknowledgement != 'DANGEROUSLY ACKNOWLEDGE' && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_IMPLEMENTATIONS_USERGROUP_ID: ${{ env.SLACK_IMPLEMENTATIONS_USERGROUP_ID }}
        run: |
          set -euo pipefail

          good_to_go="true"
          blocker=""
          status="SUCCESS"

          mark_not_good() {
            good_to_go="false"
            status="FAILURE"
            if [[ -z "${blocker}" ]]; then
              blocker="$1"
            fi
          }

          require_success() {
            local label="$1"
            local result="$2"
            if [[ "${result}" != "success" ]]; then
              mark_not_good "${label} result was ${result}"
            fi
          }

          require_success "Secret preflight" "${NIGHTLY_SECRETS_RESULT}"
          require_success "Image retag" "${RETAG_RESULT}"

          cve_status="${CVE_RESULT}"
          if [[ "${CVE_OVERRIDE_ACKNOWLEDGED}" == "1" ]]; then
            cve_status="${CVE_SCAN_RESULT:-unknown} (manual DANGEROUSLY ACKNOWLEDGE override allowed release)"
            mark_not_good "Release proceeded with DANGEROUSLY ACKNOWLEDGE CVE override"
          elif [[ "${CVE_OVERRIDE_INVALID}" == "1" ]]; then
            cve_status="failure (invalid CVE override acknowledgement)"
            mark_not_good "CVE override acknowledgement was invalid"
          elif [[ "${CVE_RESULT}" == "failure" ]]; then
            cve_status="failure (HIGH/CRITICAL findings blocked release)"
            mark_not_good "Grype found HIGH or CRITICAL vulnerabilities"
          elif [[ "${CVE_RESULT}" != "success" ]]; then
            mark_not_good "Grype CVE gate result was ${CVE_RESULT}"
          elif [[ "${CVE_SCAN_RESULT:-success}" != "success" ]]; then
            cve_status="${CVE_SCAN_RESULT} (unexpected successful job result)"
            mark_not_good "Grype CVE scan result was ${CVE_SCAN_RESULT}"
          else
            cve_status="success"
          fi

          require_success "Replicated release" "${REPLICATED_RESULT}"
          require_success "GitHub PR/release" "${PR_RESULT}"
          require_success "onprem-testbed validation" "${ONPREM_RESULT}"

          if [[ "${good_to_go}" == "true" ]]; then
            title=":white_check_mark: Nightly release: GOOD TO GO"
            verdict_line="*Good to go:* YES"
          else
            title=":rotating_light: Nightly release: NOT GOOD TO GO"
            verdict_line="*Good to go:* NO - ${blocker}"
          fi

          {
            if [[ "${good_to_go}" != "true" ]]; then
              echo "<!subteam^${SLACK_IMPLEMENTATIONS_USERGROUP_ID}|@implementations>"
            fi
            echo "${verdict_line}"
            if [[ "${CVE_OVERRIDE_ACKNOWLEDGED}" == "1" ]]; then
              echo "*DANGEROUSLY ACKNOWLEDGE used:* YES - release was allowed even though the CVE gate did not pass normally."
            fi
            if [[ "${REPLICATED_RESULT}" == "success" ]]; then
              echo "*Release created:* YES"
              echo "- Image release tag: \`${RELEASE_TAG:-unknown}\`"
              echo "- Replicated Nightly version: \`${PREVIOUS_VERSION:-unknown}\` -> \`${NEW_VERSION:-unknown}\`"
              echo "- Nightly branch: \`${RELEASE_BRANCH:-unknown}\`"
            else
              echo "*Release created:* NO"
              echo "- Intended image release tag: \`${RELEASE_TAG:-unknown}\`"
              echo "- Intended Replicated version: \`${PREVIOUS_VERSION:-unknown}\` -> \`${NEW_VERSION:-unknown}\`"
            fi
            echo "*Stages:*"
            echo "- Secret preflight: \`${NIGHTLY_SECRETS_RESULT}\`"
            echo "- Image retag: \`${RETAG_RESULT}\`"
            echo "- Grype CVE gate: \`${cve_status}\`"
            echo "- Replicated release: \`${REPLICATED_RESULT}\`"
            echo "- GitHub PR/release: \`${PR_RESULT}\`"
            echo "- onprem-testbed validation (fresh + upgrade + triggers): \`${ONPREM_RESULT}\`"
            if [[ -n "${CVE_STATS:-}" ]]; then
              echo "*Grype findings:*"
              printf '%s\n' "${CVE_STATS}"
            fi
            if [[ -n "${CVE_ARTIFACT_NAME:-}" ]]; then
              echo "*Grype artifact:* \`${CVE_ARTIFACT_NAME}\`"
            fi
            if [[ -n "${CVE_ARTIFACT_DOWNLOAD_COMMAND:-}" ]]; then
              echo "*Download Grype reports:*"
              echo "\`\`\`"
              echo "${CVE_ARTIFACT_DOWNLOAD_COMMAND}"
              echo "\`\`\`"
            fi
            links=()
            if [[ -n "${PR_URL:-}" ]]; then
              links+=("<${PR_URL}|PR>")
            fi
            if [[ -n "${RELEASE_URL:-}" ]]; then
              links+=("<${RELEASE_URL}|GitHub release>")
            fi
            links+=("<${RUN_URL}|Workflow>")
            printf '*Links:* '
            for index in "${!links[@]}"; do
              if (( index > 0 )); then
                printf ' | '
              fi
              printf '%s' "${links[index]}"
            done
            printf '\n'
          } > slack-summary.txt

          {
            echo "status=${status}"
            echo "title=${title}"
            echo "summary<<__SLACK_SUMMARY__"
            cat slack-summary.txt
            echo "__SLACK_SUMMARY__"
          } >> "${GITHUB_OUTPUT}"

      - name: Announce nightly report in Slack
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.summary.outputs.status }}
          slack_webhook_url: ${{ steps.doppler.outputs.NIGHTLY_SLACK_WEBHOOK_URL }}
          title: ${{ steps.summary.outputs.title }}
          summary: ${{ steps.summary.outputs.summary }}
