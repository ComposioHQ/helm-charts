name: Nightly Onprem Trigger Tests

on:
  push:
    branches:
      - fx-onprem-trigger-tests
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  contents: read

concurrency:
  group: nightly-onprem-trigger-tests-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# Automated nightly-release PRs call the harness from nighty-release.yml after PR creation.
# This workflow remains for manually labeled nightly PRs.
jobs:
  resolve-version:
    name: Resolve Replicated Release Version
    if: >
      github.event_name == 'push' ||
      (
      github.event.pull_request.state == 'open' &&
      (
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'nightly-release'
        ) ||
        (
          github.event.action != 'labeled' &&
          contains(github.event.pull_request.labels.*.name, 'nightly-release')
        )
      )
      )
    runs-on: ubuntu-latest
    outputs:
      helm_chart_version: ${{ steps.version.outputs.helm_chart_version }}
    steps:
      - name: Checkout PR manifest only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            manifests/k8s-app.yaml
          sparse-checkout-cone-mode: false

      - name: Resolve replicated release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            awk '
              /^  descriptor:/ { in_descriptor=1; next }
              in_descriptor && /^    version:/ {
                gsub(/"/, "", $2)
                print $2
                exit
              }
            ' manifests/k8s-app.yaml
          )"

          if [[ -z "${version}" ]]; then
            echo "Unable to resolve .spec.descriptor.version from manifests/k8s-app.yaml" >&2
            exit 1
          fi

          echo "helm_chart_version=${version}" >> "${GITHUB_OUTPUT}"

  onprem-trigger-tests:
    name: Onprem Trigger Tests
    if: >
      github.event_name == 'push' ||
      (
      github.event.pull_request.state == 'open' &&
      (
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'nightly'
        ) ||
        (
          github.event.action != 'labeled' &&
          contains(github.event.pull_request.labels.*.name, 'nightly')
        )
      )
      )
    needs:
      - resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run onprem test harness
        shell: bash
        timeout-minutes: 360
        env:
          GH_TOKEN: ${{ secrets.ONPREM_TESTBED_WORKFLOW_DISPATCH_TOKEN }}
          HELM_CHART_VERSION: ${{ needs.resolve-version.outputs.helm_chart_version }}
          ONPREM_REPO: ComposioHQ/onprem-testbed
          ONPREM_WORKFLOW_FILE: replicated-cmx-harness.yml
          HARNESS_ENV_JSON: '{"RUN_TRIGGER_TESTS":"1"}'
        run: |
          set -euo pipefail
          dispatch_started="$(date -u +%s)"

          echo "gh auth status:"
          gh auth status || true

          echo "repo visible?"
          gh api repos/ComposioHQ/onprem-testbed --jq '.full_name'

          echo "workflow visible?"
          gh api repos/ComposioHQ/onprem-testbed/actions/workflows/replicated-cmx-harness.yml --jq '.id,.path,.state'

          echo "dispatch capability test:"
          gh api -i -X POST \
            repos/ComposioHQ/onprem-testbed/actions/workflows/replicated-cmx-harness.yml/dispatches \
            -f ref=main \
            -F inputs[helm_chart_version]="${HELM_CHART_VERSION}" \
            -F inputs[harness_env_json]="${HARNESS_ENV_JSON}"

          echo "Waiting for workflow_dispatch run from capability test."

          run_id=""
          for attempt in {1..60}; do
            runs_json="$(
              gh run list \
                --repo "${ONPREM_REPO}" \
                --workflow "${ONPREM_WORKFLOW_FILE}" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,createdAt,url
            )"
            run_id="$(
              jq -r --argjson started "${dispatch_started}" '
                [.[] | select((.createdAt | fromdateiso8601) >= ($started - 60))]
                | sort_by(.createdAt)
                | reverse
                | .[0].databaseId // empty
              ' <<<"${runs_json}"
            )"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            echo "Waiting for onprem-testbed workflow run to appear (${attempt}/60)"
            sleep 10
          done

          if [[ -z "${run_id}" ]]; then
            echo "Unable to find onprem-testbed workflow_dispatch run for chart ${HELM_CHART_VERSION}" >&2
            exit 1
          fi

          run_url="$(gh run view "${run_id}" --repo "${ONPREM_REPO}" --json url --jq '.url')"
          echo "Onprem test harness run: ${run_url}"
          {
            echo "### Onprem Test Harness"
            echo
            echo "Run: ${run_url}"
          } >> "${GITHUB_STEP_SUMMARY}"

          while true; do
            run_json="$(gh run view "${run_id}" --repo "${ONPREM_REPO}" --json status,conclusion,url)"
            status="$(jq -r '.status' <<<"${run_json}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
            run_url="$(jq -r '.url' <<<"${run_json}")"

            if [[ "${status}" == "completed" ]]; then
              break
            fi
            echo "Onprem test harness status: ${status}"
            sleep 30
          done

          echo "Onprem test harness conclusion: ${conclusion}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "Onprem test harness failed with conclusion '${conclusion}': ${run_url}" >&2
            exit 1
          fi
