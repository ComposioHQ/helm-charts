name: Nightly Onprem Trigger Tests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  contents: read

concurrency:
  group: nightly-onprem-trigger-tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Automated nightly-release PRs dispatch the harness from nighty-release.yml after PR creation.
# This workflow remains for manually labeled nightly PRs.
jobs:
  resolve-version:
    name: Resolve Replicated Release Version
    if: >
      github.event.pull_request.state == 'open' &&
      (
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'nightly'
        ) ||
        (
          github.event.action != 'labeled' &&
          contains(github.event.pull_request.labels.*.name, 'nightly')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      helm_chart_version: ${{ steps.version.outputs.helm_chart_version }}
    steps:
      - name: Checkout PR manifest only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            manifests/k8s-app.yaml
          sparse-checkout-cone-mode: false

      - name: Resolve replicated release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            awk '
              /^  descriptor:/ { in_descriptor=1; next }
              in_descriptor && /^    version:/ {
                gsub(/"/, "", $2)
                print $2
                exit
              }
            ' manifests/k8s-app.yaml
          )"

          if [[ -z "${version}" ]]; then
            echo "Unable to resolve .spec.descriptor.version from manifests/k8s-app.yaml" >&2
            exit 1
          fi

          echo "helm_chart_version=${version}" >> "${GITHUB_OUTPUT}"

  onprem-trigger-tests:
    name: Onprem Trigger Tests
    if: >
      github.event.pull_request.state == 'open' &&
      (
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'nightly'
        ) ||
        (
          github.event.action != 'labeled' &&
          contains(github.event.pull_request.labels.*.name, 'nightly')
        )
      )
    needs:
      - resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COMPOSIO_INTERNAL_READER_APP_ID }}
          private-key: ${{ secrets.COMPOSIO_INTERNAL_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Dispatch onprem test harness
        uses: actions/github-script@v7
        timeout-minutes: 360
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          HELM_CHART_VERSION: ${{ needs.resolve-version.outputs.helm_chart_version }}
          ONPREM_WORKFLOW_FILE: replicated-cmx-harness.yml
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const version = process.env.HELM_CHART_VERSION || "";
            const target = {
              owner: "ComposioHQ",
              repo: "onprem-testbed",
              workflow_id: process.env.ONPREM_WORKFLOW_FILE || "replicated-cmx-harness.yml",
            };
            const sourceRunId = String(context.runId);
            const sourceRunAttempt = process.env.GITHUB_RUN_ATTEMPT || "";
            const runTitleFragment = `source ${sourceRunId}/${sourceRunAttempt}`;
            const dispatchStartedAt = new Date(Date.now() - 60_000);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            await github.rest.repos.createDispatchEvent({
              owner: target.owner,
              repo: target.repo,
              event_type: "replicated-cmx-harness",
              client_payload: {
                helm_chart_version: version,
                harness_env_json: JSON.stringify({ RUN_TRIGGER_TESTS: "1" }),
                source_context: {
                  repository: `${context.repo.owner}/${context.repo.repo}`,
                  workflow: context.workflow,
                  run_id: String(context.runId),
                  run_attempt: process.env.GITHUB_RUN_ATTEMPT || "",
                  ref: process.env.PR_HEAD_REF || "",
                  sha: process.env.PR_HEAD_SHA || "",
                  pull_request_number: Number(process.env.PR_NUMBER || "0"),
                  pull_request_url: process.env.PR_URL || "",
                },
              },
            });

            core.info(`Dispatched onprem-testbed harness for Helm chart version ${version}`);

            async function findWorkflowRun() {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: target.owner,
                repo: target.repo,
                workflow_id: target.workflow_id,
                event: "repository_dispatch",
                per_page: 50,
              });

              const candidateRuns = data.workflow_runs
                .filter((run) => new Date(run.created_at) >= dispatchStartedAt)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const exact = candidateRuns.find((run) =>
                (run.display_title || "").includes(runTitleFragment),
              );
              if (exact) {
                return exact;
              }
              return candidateRuns.length === 1 ? candidateRuns[0] : null;
            }

            let run = null;
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              run = await findWorkflowRun();
              if (run) {
                break;
              }
              core.info(`Waiting for onprem-testbed workflow run to appear (${attempt}/60)`);
              await sleep(10_000);
            }

            if (!run) {
              throw new Error(`Unable to find onprem-testbed workflow run matching ${runTitleFragment}`);
            }

            core.notice(`Onprem test harness run: ${run.html_url}`);
            await core.summary
              .addHeading("Onprem Test Harness")
              .addRaw(`Run: ${run.html_url}\n`)
              .write();

            while (run.status !== "completed") {
              core.info(`Onprem test harness status: ${run.status}`);
              await sleep(30_000);
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: target.owner,
                repo: target.repo,
                run_id: run.id,
              });
              run = data;
            }

            core.info(`Onprem test harness conclusion: ${run.conclusion}`);
            if (run.conclusion !== "success") {
              throw new Error(`Onprem test harness failed with conclusion '${run.conclusion}': ${run.html_url}`);
            }
