name: Update Image Tags

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to set for all services'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release-stable
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update values.yaml
        run: |
          cd ./composio
          yq eval '.apollo.image.tag = "${{ inputs.image_tag }}"' -i values.yaml
          yq eval '.thermos.image.tag = "${{ inputs.image_tag }}"' -i values.yaml
          yq eval '.frontend.image.tag = "${{ inputs.image_tag }}"' -i values.yaml
          yq eval '.mercury.image.tag = "${{ inputs.image_tag }}"' -i values.yaml

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "release unstable ${{ inputs.image_tag }}"
          git tag "${{ inputs.image_tag }}"
          git push origin HEAD --tags

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.image_tag }}" \
            --title "Pre-release ${{ inputs.image_tag }}" \
            --notes "Updated image tag to: \`${{ inputs.image_tag }}\`" \
            --prerelease
