name: Helm Chart Release
on:
  release:
    types: [prereleased, released]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-helm-chart:
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'prereleased'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler secrets
        run: |
          doppler secrets download --no-file --format env-no-quotes \
            --project helm-charts --config staging-gke \
            | while IFS='=' read -r key value; do
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Extract version and set promotion channel
        id: metadata
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}

          echo "::group::Debug Info"
          echo "Tag: $TAG_NAME"
          echo "Release Name: ${{ github.event.release.name }}"
          echo "Is Prerelease: ${{ github.event.release.prerelease }}"
          echo "::endgroup::"

          # Determine promotion channel based on tag pattern
          if [[ "$TAG_NAME" == release-beta-* ]]; then
            PROMOTE="Beta"
          else
            PROMOTE="Unstable"
          fi

          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "promote=$PROMOTE" >> $GITHUB_OUTPUT
          echo "Tag: $TAG_NAME"
          echo "Promote: $PROMOTE"

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Install Replicated CLI
        run: |
          version=$(curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest \
            | grep -m1 -Po '"tag_name":\s*"v\K[^"]+')
          curl -Ls \
            "https://github.com/replicatedhq/replicated/releases/download/v${version}/replicated_${version}_linux_amd64.tar.gz" \
            -o replicated.tar.gz
          tar xf replicated.tar.gz replicated && rm replicated.tar.gz
          sudo mv replicated /usr/local/bin/replicated

      - name: Check replicated
        run: |
          set -e
          replicated app ls &> /dev/null || exit 1
        env:
          REPLICATED_API_TOKEN: ${{ env.REPLICATED_API_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Run Helm template
        run: |
          helm template composio ./composio

      - name: Get and bump version
        id: version
        env:
          REPLICATED_APP: ${{ env.REPLICATED_APP }}
          REPLICATED_API_TOKEN: ${{ env.REPLICATED_API_TOKEN }}
        run: |
          cd ./composio
          CURRENT_APPVERSION=$(replicated channel ls | grep "Unstable" | awk '{print $NF}')
          NEW_APPVERSION=$(echo "$CURRENT_APPVERSION" | awk -F. '{$NF = $NF + 1} 1' OFS=.)
          echo "current=$CURRENT_APPVERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_APPVERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_APPVERSION"
          echo "New version: $NEW_APPVERSION"

      - name: Notify Slack - Started
        id: slack
        uses: ./.github/actions/slack-notify
        with:
          status: STARTED
          slack_bot_token: ${{ env.SLACK_BOT_TOKEN }}
          channel: C093CVARNKC
          title: "New ${{ steps.metadata.outputs.promote }} Release"
          summary: |
            *Version:* `${{ steps.version.outputs.current }}` → `${{ steps.version.outputs.new }}`
            *Tag:* `${{ steps.metadata.outputs.tag }}`
            *Channel:* ${{ steps.metadata.outputs.promote }}

      - name: Update Chart.yaml versions
        run: |
          cd ./composio
          export NEW_VERSION="${{ steps.version.outputs.new }}"
          yq eval -i '.appVersion = strenv(NEW_VERSION)' ./Chart.yaml
          yq eval -i '.version = strenv(NEW_VERSION)' ./Chart.yaml
          echo "Updated Chart.yaml"

      - name: Update manifest versions
        run: |
          cd ./manifests
          export NEW_VERSION="${{ steps.version.outputs.new }}"
          yq eval -i '.metadata.labels."app.kubernetes.io/version" = strenv(NEW_VERSION)' ./k8s-app.yaml
          yq eval -i '.spec.descriptor.version = strenv(NEW_VERSION)' ./k8s-app.yaml
          yq eval -i '.spec.chart.chartVersion = strenv(NEW_VERSION)' ./composio.yaml
          echo "Updated manifest files"

      - name: Clean old packages
        run: |
          echo "Removing old tgz files"
          rm -f ./manifests/*.tgz

      - name: Package and create Replicated release
        run: |
          echo "Packaging Helm chart..."
          helm package ./composio --destination manifests
          echo "Creating Replicated release..."
          replicated release create \
          --yaml-dir manifests \
          --promote "${{ steps.metadata.outputs.promote }}" \
          --version "${{ steps.version.outputs.new }}" --release-notes "${{ github.event.release.body }}"
        env:
          REPLICATED_API_TOKEN: ${{ env.REPLICATED_API_TOKEN }}
          REPLICATED_APP: composio-rodent

      - name: Notify Slack - Success
        if: success()
        uses: ./.github/actions/slack-notify
        with:
          status: SUCCESS
          slack_bot_token: ${{ env.SLACK_BOT_TOKEN }}
          channel: C093CVARNKC
          message_id: ${{ steps.slack.outputs.message_id }}
          title: "New ${{ steps.metadata.outputs.promote }} Release"
          summary: |
            *Version:* `${{ steps.version.outputs.current }}` → `${{ steps.version.outputs.new }}`
            *Tag:* `${{ steps.metadata.outputs.tag }}`
            *Channel:* ${{ steps.metadata.outputs.promote }}

      - name: Notify Slack - Failure
        if: failure() && steps.slack.outputs.message_id
        uses: ./.github/actions/slack-notify
        with:
          status: FAILURE
          slack_bot_token: ${{ env.SLACK_BOT_TOKEN }}
          channel: C093CVARNKC
          message_id: ${{ steps.slack.outputs.message_id }}
          title: "New ${{ steps.metadata.outputs.promote }} Release"
          summary: |
            *Version:* `${{ steps.version.outputs.current }}` → `${{ steps.version.outputs.new }}`
            *Tag:* `${{ steps.metadata.outputs.tag }}`
            *Channel:* ${{ steps.metadata.outputs.promote }}

  deploy-to-gke:
    needs: [release-helm-chart]
    if: |
      github.event.action == 'prereleased'
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: write
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler secrets
        run: |
          # Handle GKE_SA_KEY separately (multiline JSON)
          echo "GKE_SA_KEY<<EOFGKESA" >> "$GITHUB_ENV"
          doppler secrets get GKE_SA_KEY --plain --project helm-charts --config staging-gke >> "$GITHUB_ENV"
          echo "EOFGKESA" >> "$GITHUB_ENV"

          # Fetch remaining secrets
          for key in DATABASE_HOST DATABASE_USER GKE_CLUSTER_NAME GKE_CLUSTER_ZONE GKE_PROJECT_ID \
                     REPLICATED_API_TOKEN REPLICATED_APP REPLICATED_HELM_AUTH_TOKEN \
                     REPLICATED_USERNAME REPLICATED_REGISTRY HELM_REGISTRY; do
            val=$(doppler secrets get "$key" --plain --project helm-charts --config staging-gke)
            echo "::add-mask::$val"
            echo "$key=$val" >> "$GITHUB_ENV"
          done
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GKE_SA_KEY }}
          project_id: ${{ env.GKE_PROJECT_ID }}

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet &> /dev/null || exit 1

      - name: Configure kubectl for GKE
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" --zone "$GKE_CLUSTER_ZONE" &> /dev/null || exit 1
        env:
          GKE_CLUSTER_NAME: ${{ env.GKE_CLUSTER_NAME }}
          GKE_CLUSTER_ZONE: ${{ env.GKE_CLUSTER_ZONE }}

      - name: Verify GKE Connection
        run: |
          kubectl get namespaces &> /dev/null || exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Replicated CLI
        run: |
          version=$(curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest \
            | grep -m1 -Po '"tag_name":\s*"v\K[^"]+')
          curl -Ls \
            "https://github.com/replicatedhq/replicated/releases/download/v${version}/replicated_${version}_linux_amd64.tar.gz" \
            -o replicated.tar.gz
          tar xf replicated.tar.gz replicated && rm replicated.tar.gz
          mv replicated /usr/local/bin/replicated

      - name: Check replicated
        env:
          REPLICATED_API_TOKEN: ${{ env.REPLICATED_API_TOKEN }}
        run: |
          set -e
          replicated app ls &> /dev/null || exit 1

      - name: Get latest replicated version
        id: get_version
        env:
          REPLICATED_APP: ${{ env.REPLICATED_APP }}
          REPLICATED_API_TOKEN: ${{ env.REPLICATED_API_TOKEN }}
        run: |
          STABLE_VERSION=$(replicated channel ls | grep "Stable" | awk '{print $NF}')
          UNSTABLE_VERSION=$(replicated channel ls | grep "Unstable" | awk '{print $NF}')
          echo "Stable version: $STABLE_VERSION"
          echo "Unstable version: $UNSTABLE_VERSION"
          echo "stable=$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "unstable=$UNSTABLE_VERSION" >> $GITHUB_OUTPUT

      - name: Deploy on kubernetes using replicated
        run: |
          helm registry login $REPLICATED_REGISTRY --username $REPLICATED_USERNAME --password $AUTH_TOKEN
          helm upgrade composio $HELM_URL  \
            --install \
            --create-namespace \
            --namespace composio \
            --values ./composio/staging-gke-values-override.yaml \
            --set databaseMigration.host="$DATABASE_HOST" \
            --set databaseMigration.user="$DATABASE_USER" \
            --set temporal.server.config.persistence.default.sql.host="$DATABASE_HOST" \
            --set temporal.server.config.persistence.visibility.sql.host="$DATABASE_HOST" \
            --wait \
            --timeout 20m \
            --version ${{ steps.get_version.outputs.unstable }}
        env:
          AUTH_TOKEN: ${{ env.REPLICATED_HELM_AUTH_TOKEN }}
          REPLICATED_USERNAME: ${{ env.REPLICATED_USERNAME }}
          HELM_URL: ${{ env.HELM_REGISTRY }}
          REPLICATED_REGISTRY: ${{ env.REPLICATED_REGISTRY }}
          DATABASE_HOST: ${{ env.DATABASE_HOST }}
          DATABASE_USER: ${{ env.DATABASE_USER }}

      - name: Deployment Summary
        if: success()
        run: |
          echo "Deployment completed successfully!"

      - name: Handle Deployment Failure
        if: failure()
        run: |
          echo "Deployment failed!"

  release-stable:
    runs-on: ubuntu-latest
    if: github.event.action == 'released'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler secrets
        run: |
          doppler secrets download --no-file --format env-no-quotes \
            --project helm-charts --config staging-gke \
            | while IFS='=' read -r key value; do
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Extract version
        id: metadata
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}

          echo "::group::Release Info"
          echo "Tag: $TAG_NAME"
          echo "Release Name: ${{ github.event.release.name }}"
          echo "Converting pre-release to stable release"
          echo "::endgroup::"

          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "promote=Stable" >> $GITHUB_OUTPUT
          echo "Tag: $TAG_NAME"
          echo "Promote: Stable"

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Install Replicated CLI
        run: |
          version=$(curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest \
            | grep -m1 -Po '"tag_name":\s*"v\K[^"]+')
          curl -Ls \
            "https://github.com/replicatedhq/replicated/releases/download/v${version}/replicated_${version}_linux_amd64.tar.gz" \
            -o replicated.tar.gz
          tar xf replicated.tar.gz replicated && rm replicated.tar.gz
          sudo mv replicated /usr/local/bin/replicated

      - name: Check replicated
        run: |
          set -e
          replicated app ls &> /dev/null || exit 1
        env:
          REPLICATED_API_TOKEN: ${{ env.REPLICATED_API_TOKEN }}

      - name: Get latest sequence from Unstable
        id: get_sequence
        run: |
          # Get latest sequence and version from Unstable
          LATEST_SEQUENCE_UNSTABLE=$(replicated release ls | grep "Unstable" | head -n 1 | awk '{print $1}')
          CURRENT_VERSION_UNSTABLE=$(replicated channel ls | grep "Unstable" | awk '{print $NF}')
          CURRENT_VERSION_STABLE=$(replicated channel ls | grep "Stable" | awk '{print $NF}')
          NEW_APPVERSION=$(echo "$CURRENT_VERSION_UNSTABLE")
          CHANNEL_ID=$(replicated channel ls | grep Stable | awk '{print $1}')
          echo "channel_id=$CHANNEL_ID" >> $GITHUB_OUTPUT
          echo "sequence=$LATEST_SEQUENCE_UNSTABLE" >> $GITHUB_OUTPUT
          echo "version=$CURRENT_VERSION_UNSTABLE" >> $GITHUB_OUTPUT
          echo "stable_version=$CURRENT_VERSION_STABLE" >> $GITHUB_OUTPUT
          echo "Promoting sequence $LATEST_SEQUENCE_UNSTABLE (version $CURRENT_VERSION_UNSTABLE) from Unstable to Stable"
        env:
          REPLICATED_API_TOKEN: ${{ env.REPLICATED_API_TOKEN }}
          REPLICATED_APP: ${{ env.REPLICATED_APP }}

      - name: Notify Slack - Started
        id: slack
        uses: ./.github/actions/slack-notify
        with:
          status: STARTED
          slack_bot_token: ${{ env.SLACK_BOT_TOKEN }}
          channel: C093CVARNKC
          title: "Promote to Stable"
          summary: |
            *Version:* `${{ steps.get_sequence.outputs.stable_version }}` → `${{ steps.get_sequence.outputs.version }}`
            *Source:* Unstable → Stable
            *Tag:* `${{ steps.metadata.outputs.tag }}`

      - name: Promote from Stable to Unstable
        env:
          REPLICATED_APP: ${{ env.REPLICATED_APP }}
          REPLICATED_API_TOKEN: ${{ env.REPLICATED_API_TOKEN }}
        run: |
          set -e
          replicated release promote ${{ steps.get_sequence.outputs.sequence }} ${{ steps.get_sequence.outputs.channel_id }} --version ${{ steps.get_sequence.outputs.version }} --release-notes "${{ github.event.release.body }}"

      - name: Summary
        run: |
          echo "### Helm Chart Release Created for Stable Channel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get_sequence.outputs.version }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack - Success
        if: success()
        uses: ./.github/actions/slack-notify
        with:
          status: SUCCESS
          slack_bot_token: ${{ env.SLACK_BOT_TOKEN }}
          channel: C093CVARNKC
          message_id: ${{ steps.slack.outputs.message_id }}
          title: "Promote to Stable"
          summary: |
            *Version:* `${{ steps.get_sequence.outputs.stable_version }}` → `${{ steps.get_sequence.outputs.version }}`
            *Source:* Unstable → Stable
            *Tag:* `${{ steps.metadata.outputs.tag }}`

      - name: Notify Slack - Failure
        if: failure() && steps.slack.outputs.message_id
        uses: ./.github/actions/slack-notify
        with:
          status: FAILURE
          slack_bot_token: ${{ env.SLACK_BOT_TOKEN }}
          channel: C093CVARNKC
          message_id: ${{ steps.slack.outputs.message_id }}
          title: "Promote to Stable"
          summary: |
            *Version:* `${{ steps.get_sequence.outputs.stable_version }}` → `${{ steps.get_sequence.outputs.version }}`
            *Source:* Unstable → Stable
            *Tag:* `${{ steps.metadata.outputs.tag }}`
