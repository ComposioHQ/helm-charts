name: Generate Release Changelog

on:
  push:
    branches:
      - ft-add-generate-changelog-action
  workflow_dispatch:
    inputs:
      from_release:
        description: Older chart version or git ref
        required: true
        default: "0.1.72"
        type: string
      to_release:
        description: Newer chart version or git ref
        required: true
        default: "0.1.84"
        type: string
      chart_oci_ref:
        description: OCI chart reference used when a version is not available in git history
        required: true
        type: string
      output_file:
        description: Markdown file to generate
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Generate changelog
        id: generate
        shell: bash
        env:
          CHANGELOG_FROM_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.from_release || '0.1.72' }}
          CHANGELOG_TO_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.to_release || '0.1.84' }}
          CHANGELOG_OUTPUT_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.output_file || 'release-changelog.md' }}
          CHART_OCI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.chart_oci_ref || 'oci://registry.composio.io/composio-rodent/nightly/composio' }}
          GITHUB_TOKEN: ${{ github.token }}
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.CROSS_REPO_GITHUB_TOKEN }}
          CHART_REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME }}
          CHART_REGISTRY_PASSWORD: ${{ secrets.CHART_REGISTRY_PASSWORD }}
          REPLICATED_USERNAME: ${{ secrets.REPLICATED_USERNAME }}
          REPLICATED_HELM_AUTH_TOKEN: ${{ secrets.REPLICATED_HELM_AUTH_TOKEN }}
        run: |
          ./.github/scripts/generate-release-changelog.sh \
            "${CHANGELOG_FROM_RELEASE}" \
            "${CHANGELOG_TO_RELEASE}" \
            "${CHANGELOG_OUTPUT_FILE}"

      - name: Publish step summary
        shell: bash
        run: |
          cat "${{ steps.generate.outputs.output_file }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: ${{ steps.generate.outputs.output_file }}
          if-no-files-found: error
